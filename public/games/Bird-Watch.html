<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小鸟互视</title>

  <link href="https://fonts.googleapis.com/css?family=Open+Sans:800" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Open Sans', sans-serif; }
    
    .back-btn {
        position: fixed;
        top: 80px;
        right: 24px;
        z-index: 101;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(45, 122, 45, 0.1);
        border: 1px solid rgba(45, 122, 45, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.25s ease;
        text-decoration: none;
    }
    .back-btn:hover {
        background: rgba(45, 122, 45, 0.2);
        border-color: rgba(45, 122, 45, 0.4);
        transform: scale(1.08);
    }
    .back-btn svg {
        width: 18px;
        height: 18px;
        stroke: #2d7a2d;
        stroke-width: 2;
        fill: none;
    }
    @media (max-width: 768px) {
        .back-btn { top: 70px; right: 16px; width: 38px; height: 38px; }
        .back-btn svg { width: 16px; height: 16px; }
    }

    #world {
      background: #e0dacd;
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #instructions {
      position: absolute;
      width: 100%;
      top: 50%;
      margin-top: 50px;
      color: #b75505;
      font-size: 0.9em;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }
    #instructions .arrow {
      font-size: 1.5em;
      line-height: 1;
    }
    .light-instructions {
      color: #b59b63;
      font-size: 0.8em;
      display: block;
      margin-top: 4px;
    }

  </style>
<base target="_blank">
</head>
<body>
  <a href="../../works/works-games.html" class="back-btn" aria-label="返回" target="_self" onclick="history.back(); return false;">
    <svg viewBox="0 0 24 24">
      <path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <div id="world"></div>

  <div id="instructions">
    <div class="arrow">^</div>
    <div>移动鼠标控制中间的小鸟</div>
    <span class="light-instructions">
      观察另外两只小鸟<br/>如何与它互动
    </span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // ==================== Three.js 变量 ====================
    let 场景, 相机, 渲染器, 容器;
    let 阴影光, 背光, 环境光;
    let 地面;
    let 小鸟甲, 小鸟乙, 小鸟丙;

    let 画布高度, 画布宽度, 半宽, 半高;
    let 鼠标位置 = { x: 0, y: 0 };

    // ==================== 初始化 ====================
    function 初始化() {
      场景 = new THREE.Scene();

      画布高度 = window.innerHeight;
      画布宽度 = window.innerWidth;
      半宽 = 画布宽度 / 2;
      半高 = 画布高度 / 2;

      const 宽高比 = 画布宽度 / 画布高度;
      相机 = new THREE.PerspectiveCamera(60, 宽高比, 1, 2000);
      相机.position.set(0, 300, 1000);
      相机.lookAt(new THREE.Vector3(0, 0, 0));

      渲染器 = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      渲染器.setPixelRatio(window.devicePixelRatio);
      渲染器.setSize(画布宽度, 画布高度);
      渲染器.shadowMap.enabled = true;

      容器 = document.getElementById('world');
      容器.appendChild(渲染器.domElement);

      window.addEventListener('resize', 窗口缩放, false);
      document.addEventListener('mousemove', 鼠标移动, false);
      document.addEventListener('touchstart', 触摸开始, { passive: false });
      document.addEventListener('touchend', 触摸结束, false);
      document.addEventListener('touchmove', 触摸移动, { passive: false });
    }

    function 窗口缩放() {
      画布高度 = window.innerHeight;
      画布宽度 = window.innerWidth;
      半宽 = 画布宽度 / 2;
      半高 = 画布高度 / 2;
      渲染器.setSize(画布宽度, 画布高度);
      相机.aspect = 画布宽度 / 画布高度;
      相机.updateProjectionMatrix();
    }

    function 鼠标移动(event) {
      鼠标位置 = { x: event.clientX, y: event.clientY };
    }

    function 触摸开始(event) {
      if (event.touches.length > 1) {
        event.preventDefault();
        鼠标位置 = { x: event.touches[0].pageX, y: event.touches[0].pageY };
      }
    }

    function 触摸结束() {
      鼠标位置 = { x: 半宽, y: 半高 };
    }

    function 触摸移动(event) {
      if (event.touches.length === 1) {
        event.preventDefault();
        鼠标位置 = { x: event.touches[0].pageX, y: event.touches[0].pageY };
      }
    }

    // ==================== 灯光 ====================
    function 创建灯光() {
      环境光 = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.5);

      阴影光 = new THREE.DirectionalLight(0xffffff, 0.8);
      阴影光.position.set(200, 200, 200);
      阴影光.castShadow = true;
      阴影光.shadow.mapSize.width = 2048;
      阴影光.shadow.mapSize.height = 2048;

      背光 = new THREE.DirectionalLight(0xffffff, 0.4);
      背光.position.set(-100, 200, 50);
      背光.castShadow = true;

      场景.add(背光);
      场景.add(环境光);
      场景.add(阴影光);
    }

    // ==================== 地面 ====================
    function 创建地面() {
      const 地面几何 = new THREE.PlaneGeometry(1000, 1000);
      const 地面材质 = new THREE.MeshBasicMaterial({ color: 0xe0dacd });
      地面 = new THREE.Mesh(地面几何, 地面材质);
      地面.rotation.x = -Math.PI / 2;
      地面.position.y = -33;
      地面.receiveShadow = true;
      场景.add(地面);
    }

    // ==================== 小鸟类 ====================
    class 小鸟 {
      constructor() {
        this.径向分段 = 4;
        this.高度分段 = 3;
        this.身体初始顶点 = [];
        this.垂直角 = 0;
        this.水平角 = 0;

        this.正常肤色 = { r: 255/255, g: 222/255, b: 121/255 };
        this.害羞肤色 = { r: 255/255, g: 157/255, b: 101/255 };
        this.颜色 = { ...this.正常肤色 };
        this.朝向 = '左';

        this.害羞角度 = { h: 0, v: 0 };
        this.行为定时器 = null;
        this.正在害羞 = false;

        this.三维组 = new THREE.Group();

        // 使用 MeshPhongMaterial 替代 MeshLambertMaterial，flatShading 有效
        this.黄色材质 = new THREE.MeshPhongMaterial({ 
          color: 0xffde79, 
          flatShading: true 
        });
        this.白色材质 = new THREE.MeshPhongMaterial({ 
          color: 0xffffff, 
          flatShading: true 
        });
        this.黑色材质 = new THREE.MeshPhongMaterial({ 
          color: 0x000000, 
          flatShading: true 
        });
        this.橙色材质 = new THREE.MeshPhongMaterial({ 
          color: 0xff5535, 
          flatShading: true 
        });

        this.构建身体();
        this.构建翅膀();
        this.构建面部();
        this.构建羽毛();

        this.三维组.traverse((物体) => {
          if (物体 instanceof THREE.Mesh) {
            物体.castShadow = true;
            物体.receiveShadow = true;
          }
        });
      }

      构建身体() {
        // 使用 CylinderGeometry (r128 中替代 CylinderGeometry 的 BufferGeometry 版本)
        const 身体几何 = new THREE.CylinderGeometry(40, 70, 200, this.径向分段, this.高度分段);
        this.身体 = new THREE.Mesh(身体几何, this.黄色材质);
        this.身体.position.y = 70;

        // r128 中 geometry.vertices 已移除，使用 position attribute
        const 位置属性 = this.身体.geometry.attributes.position;
        this.顶点数量 = 位置属性.count;

        for (let i = 0; i < this.顶点数量; i++) {
          this.身体初始顶点.push({
            x: 位置属性.getX(i),
            y: 位置属性.getY(i),
            z: 位置属性.getZ(i)
          });
        }

        this.三维组.add(this.身体);
      }

      构建翅膀() {
        const 翅膀几何 = new THREE.BoxGeometry(60, 60, 5);

        this.左翼组 = new THREE.Group();
        const 左翼 = new THREE.Mesh(翅膀几何, this.黄色材质);
        左翼.rotation.x = -Math.PI / 4;
        this.左翼组.add(左翼);
        this.左翼组.position.set(70, 0, 0);
        this.左翼组.rotation.y = Math.PI / 2;

        this.右翼组 = new THREE.Group();
        const 右翼 = new THREE.Mesh(翅膀几何, this.黄色材质);
        右翼.rotation.x = -Math.PI / 4;
        this.右翼组.add(右翼);
        this.右翼组.position.set(-70, 0, 0);
        this.右翼组.rotation.y = -Math.PI / 2;

        this.三维组.add(this.左翼组);
        this.三维组.add(this.右翼组);
      }

      构建面部() {
        this.面部 = new THREE.Group();

        const 眼睛几何 = new THREE.BoxGeometry(60, 60, 10);
        const 瞳孔几何 = new THREE.BoxGeometry(10, 10, 10);

        this.左眼 = new THREE.Mesh(眼睛几何, this.白色材质);
        this.左眼.position.set(-30, 120, 35);
        this.左眼.rotation.y = -Math.PI / 4;

        this.左瞳孔 = new THREE.Mesh(瞳孔几何, this.黑色材质);
        this.左瞳孔.position.set(-30, 120, 40);
        this.左瞳孔.rotation.y = -Math.PI / 4;

        this.右眼 = new THREE.Mesh(眼睛几何, this.白色材质);
        this.右眼.position.set(30, 120, 35);
        this.右眼.rotation.y = Math.PI / 4;

        this.右瞳孔 = new THREE.Mesh(瞳孔几何, this.黑色材质);
        this.右瞳孔.position.set(30, 120, 40);
        this.右瞳孔.rotation.y = Math.PI / 4;

        const 喙几何 = new THREE.CylinderGeometry(0, 20, 20, 4, 1);
        this.喙 = new THREE.Mesh(喙几何, this.橙色材质);
        this.喙.position.set(0, 70, 65);
        this.喙.rotation.x = Math.PI / 2;

        this.面部.add(this.右眼, this.右瞳孔, this.左眼, this.左瞳孔, this.喙);
        this.三维组.add(this.面部);
      }

      构建羽毛() {
        const 羽毛几何 = new THREE.BoxGeometry(10, 20, 5);

        this.羽毛一 = new THREE.Mesh(羽毛几何, this.黄色材质);
        this.羽毛一.position.set(0, 185, 55);
        this.羽毛一.rotation.x = Math.PI / 4;
        this.羽毛一.scale.set(1.5, 1.5, 1);

        this.羽毛二 = new THREE.Mesh(羽毛几何, this.黄色材质);
        this.羽毛二.position.set(20, 180, 50);
        this.羽毛二.rotation.set(Math.PI / 4, 0, -Math.PI / 8);

        this.羽毛三 = new THREE.Mesh(羽毛几何, this.黄色材质);
        this.羽毛三.position.set(-20, 180, 50);
        this.羽毛三.rotation.set(Math.PI / 4, 0, Math.PI / 8);

        this.面部.add(this.羽毛一, this.羽毛二, this.羽毛三);
      }

      注视(水平角, 垂直角) {
        this.水平角 = 水平角;
        this.垂直角 = 垂直角;

        this.左瞳孔.position.y = 120 - 垂直角 * 30;
        this.左瞳孔.position.x = -30 + 水平角 * 10;
        this.左瞳孔.position.z = 40 + 水平角 * 10;

        this.右瞳孔.position.y = 120 - 垂直角 * 30;
        this.右瞳孔.position.x = 30 + 水平角 * 10;
        this.右瞳孔.position.z = 40 - 水平角 * 10;

        this.左眼.position.y = this.右眼.position.y = 120 - 垂直角 * 10;

        this.喙.position.y = 70 - 垂直角 * 20;
        this.喙.rotation.x = Math.PI / 2 + 垂直角 / 3;

        [this.羽毛一, this.羽毛二, this.羽毛三].forEach((羽毛, i) => {
          羽毛.rotation.x = Math.PI / 4 + 垂直角 / 2;
          羽毛.position.y = (i === 0 ? 185 : 180) - 垂直角 * 10;
          羽毛.position.z = (i === 0 ? 55 : 50) + 垂直角 * 10;
        });

        // r128 中更新顶点位置
        const 位置属性 = this.身体.geometry.attributes.position;
        for (let i = 0; i < this.顶点数量; i++) {
          const 行 = Math.floor(i / (this.径向分段 + 1));
          const 初始位置 = this.身体初始顶点[i];

          const 角度 = 行 >= this.高度分段 - 1 ? 0 : 水平角 / (行 + 1);
          const 新X = 初始位置.x * Math.cos(角度) + 初始位置.z * Math.sin(角度);
          const 新Z = -初始位置.x * Math.sin(角度) + 初始位置.z * Math.cos(角度);

          位置属性.setXYZ(i, 新X, 初始位置.y, 新Z);
        }

        this.面部.rotation.y = 水平角;
        位置属性.needsUpdate = true;
        this.身体.geometry.computeVertexNormals();
      }

      躲闪(快速移动 = false) {
        const 速度 = 快速移动 ? 0.4 : 2;
        const 缓动 = 快速移动 ? 'power4.out' : 'power4.inOut';
        const 延迟 = 快速移动 ? 0.2 : 0;
        const 目标色 = 快速移动 ? this.害羞肤色 : this.正常肤色;

        const 垂直目标 = (-1 + Math.random() * 2) * Math.PI / 3;
        const 喙缩放X = 0.75 + Math.random() * 0.25;
        const 喙缩放Z = 0.5 + Math.random() * 0.5;

        const 水平目标 = this.朝向 === '右' 
          ? (-1 + Math.random()) * Math.PI / 4 
          : Math.random() * Math.PI / 4;

        gsap.killTweensOf(this.害羞角度);
        gsap.to(this.害羞角度, { 
          v: 垂直目标, 
          h: 水平目标, 
          duration: 速度, 
          ease: 缓动, 
          delay: 延迟 
        });
        gsap.to(this.颜色, { 
          r: 目标色.r, 
          g: 目标色.g, 
          b: 目标色.b, 
          duration: 速度, 
          ease: 缓动, 
          delay: 延迟 
        });
        gsap.to(this.喙.scale, { 
          z: 喙缩放Z, 
          x: 喙缩放X, 
          duration: 速度, 
          ease: 缓动, 
          delay: 延迟 
        });
      }

      直视() {
        const 目标色 = this.正常肤色;
        const 水平目标 = this.朝向 === '右' ? Math.PI / 3 : -Math.PI / 3;

        gsap.to(this.害羞角度, { 
          v: -0.5, 
          h: 水平目标, 
          duration: 2, 
          ease: 'power4.inOut' 
        });
        gsap.to(this.颜色, { 
          r: 目标色.r, 
          g: 目标色.g, 
          b: 目标色.b, 
          duration: 2, 
          ease: 'power4.inOut' 
        });
        gsap.to(this.喙.scale, { 
          z: 0.8, 
          x: 1.5, 
          duration: 2, 
          ease: 'power4.inOut' 
        });
      }
    }

    // ==================== 创建小鸟 ====================
    function 创建小鸟们() {
      小鸟甲 = new 小鸟();
      小鸟甲.三维组.position.x = 0;
      场景.add(小鸟甲.三维组);

      小鸟乙 = new 小鸟();
      小鸟乙.三维组.position.set(-250, -8, 0);
      小鸟乙.朝向 = '右';
      小鸟乙.三维组.scale.set(0.8, 0.8, 0.8);
      场景.add(小鸟乙.三维组);

      小鸟丙 = new 小鸟();
      小鸟丙.三维组.position.set(250, -8, 0);
      小鸟丙.朝向 = '左';
      小鸟丙.三维组.scale.set(0.8, 0.8, 0.8);
      场景.add(小鸟丙.三维组);
    }

    // ==================== 动画循环 ====================
    function 循环() {
      const 临时水平角 = (鼠标位置.x - 半宽) / 200;
      const 临时垂直角 = (鼠标位置.y - 半高) / 200;
      const 用户水平角 = Math.min(Math.max(临时水平角, -Math.PI / 3), Math.PI / 3);
      const 用户垂直角 = Math.min(Math.max(临时垂直角, -Math.PI / 3), Math.PI / 3);

      小鸟甲.注视(用户水平角, 用户垂直角);

      if (小鸟甲.水平角 < -Math.PI / 5 && !小鸟乙.正在害羞) {
        小鸟乙.躲闪(true);
        小鸟乙.正在害羞 = true;
        小鸟乙.行为定时器 = setInterval(() => 小鸟乙.躲闪(false), 1500);
      } else if (小鸟甲.水平角 > 0 && 小鸟乙.正在害羞) {
        小鸟乙.直视();
        clearInterval(小鸟乙.行为定时器);
        小鸟乙.正在害羞 = false;
      }

      if (小鸟甲.水平角 > Math.PI / 5 && !小鸟丙.正在害羞) {
        小鸟丙.躲闪(true);
        小鸟丙.正在害羞 = true;
        小鸟丙.行为定时器 = setInterval(() => 小鸟丙.躲闪(false), 1500);
      } else if (小鸟甲.水平角 < 0 && 小鸟丙.正在害羞) {
        小鸟丙.直视();
        clearInterval(小鸟丙.行为定时器);
        小鸟丙.正在害羞 = false;
      }

      小鸟乙.注视(小鸟乙.害羞角度.h, 小鸟乙.害羞角度.v);
      小鸟乙.身体.material.color.setRGB(小鸟乙.颜色.r, 小鸟乙.颜色.g, 小鸟乙.颜色.b);

      小鸟丙.注视(小鸟丙.害羞角度.h, 小鸟丙.害羞角度.v);
      小鸟丙.身体.material.color.setRGB(小鸟丙.颜色.r, 小鸟丙.颜色.g, 小鸟丙.颜色.b);

      渲染器.render(场景, 相机);
      requestAnimationFrame(循环);
    }

    // ==================== 启动 ====================
    初始化();
    创建灯光();
    创建地面();
    创建小鸟们();
    循环();
  </script>
</body>
</html>
