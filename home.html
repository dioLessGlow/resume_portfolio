                <div class="btn-row">
                    <a href="https://diolessglow.github.io/customs-smuggling-game/" class="home-btn" target="_blank" rel="noopener noreferrer">查看作品集 →</a>
                    <a href="intro.html" class="home-btn">查看个人简介 →</a>
                </div>
                <span class="btn-underline"></span>
                <span class="typewriter-info"></span>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <script type="module" src="js/components.js"></script>
    <script>
        // 打字机效果 (使用 components.js 共享函数)
        
        // 卡片悬停事件 - 按钮下方打字
        const globalTypewriter = document.querySelector('.typewriter-info');
        document.querySelectorAll('.hex-card').forEach(card => {
            card.addEventListener('mouseenter', function () {
                const line1 = this.dataset.line1;
                const line2 = this.dataset.line2;
                if (globalTypewriter) {
                    if (line1 && line2) {
                        typeText(globalTypewriter, line1 + "<br>" + line2, 40);
                    } else if (this.dataset.info) {
                        typeText(globalTypewriter, this.dataset.info, 40);
                    }
                }
            });

            card.addEventListener('mouseleave', function () {
                if (globalTypewriter) {
                    clearTypewriter(globalTypewriter);
                }
            });
        });

        setTimeout(function () {
            console.log('Page loaded');
        }, 1000);

        // ===== 头像动画 =====
        gsap.registerPlugin(CustomEase);

        // 时间线先暂停，等 loader 遮罩撤除后再播放，避免动画在遮罩下面演完
        const meTl = gsap.timeline({ paused: true });

        gsap.set(".bg", { transformOrigin: "50% 50%" });
        gsap.set(".ear-right", { transformOrigin: "0% 50%" });
        gsap.set(".ear-left", { transformOrigin: "100% 50%" });
        gsap.set(".me", { opacity: 1 });

        meTl
            .from(".me", {
                duration: 1,
                yPercent: 100,
                ease: "elastic.out(0.5, 0.4)"
            }, 0.15)
            .from(".head, .hair-front, .shadow", {
                duration: 0.9,
                yPercent: 20,
                ease: "elastic.out(0.58, 0.25)"
            }, 0.25)
            .from(".ear-right", {
                duration: 1,
                rotate: 40,
                yPercent: 10,
                ease: "elastic.out(0.5, 0.2)"
            }, 0.35)
            .from(".ear-left", {
                duration: 1,
                rotate: -40,
                yPercent: 10,
                ease: "elastic.out(0.5, 0.2)"
            }, 0.35)
            .from(".eyebrow_right, .eyebrow_left", {
                duration: 1,
                yPercent: 300,
                ease: "elastic.out(0.5, 0.2)"
            }, 0.35);

        // 由 loader 撤除事件触发；loader 不可用时兜底播放
        let avatarIntroStarted = false;
        function startAvatarIntro() {
            if (avatarIntroStarted) return;
            avatarIntroStarted = true;
            requestAnimationFrame(() => meTl.play(0));
        }
        window.addEventListener('loader:hidden', startAvatarIntro);
        setTimeout(startAvatarIntro, 2200);

        // 眨眼动画
        const blink = gsap.timeline({
            repeat: -1,
            repeatDelay: 5,
            paused: true
        });

        blink.to(".eye-left, .eye-right", {
            duration: 0.01,
            opacity: 0
        }, 0)
            .to(".eye-left, .eye-right", {
                duration: 0.01,
                opacity: 1
            }, 0.15);

        // 3秒后开始眨眼
        setTimeout(() => blink.play(), 3000);

        // 眼睛跟随鼠标
        const svg = document.querySelector('.avatar-svg');
        const eyeLeft = document.querySelector('.eye-left');
        const eyeRight = document.querySelector('.eye-right');

        if (svg && eyeLeft && eyeRight) {
            document.addEventListener('mousemove', (e) => {
                const rect = svg.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const svgWidth = rect.width;
                const svgHeight = rect.height;

                // 归一化
                const moveX = ((mouseX / svgWidth) - 0.5) * 2;
                const moveY = ((mouseY / svgHeight) - 0.5) * 2;

                // 限制范围：左/上更大
                const minX = -1;  // 左边范围更大
                const maxX = 1;
                const minY = -2;  // 上边范围更大
                const maxY = 0.5;

                const clampedMoveX = Math.max(minX, Math.min(maxX, moveX));
                const clampedMoveY = Math.max(minY, Math.min(maxY, moveY));

                const maxMove = 3;

                gsap.to(eyeLeft, {
                    x: clampedMoveX * maxMove,
                    y: clampedMoveY * maxMove,
                    duration: 0.1
                });

                gsap.to(eyeRight, {
                    x: clampedMoveX * maxMove,
                    y: clampedMoveY * maxMove,
                    duration: 0.1
                });
            });
        }
    </script>
</body>

</html>
