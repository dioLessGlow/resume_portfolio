    <style>
        * {
            border: 0;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --hue: 223deg;
            --gray1: hsl(var(--hue) 10% 95%);
            --gray9: hsl(var(--hue) 10% 15%);
            --black: hsl(0 0% 0%);
            --primary3: hsl(var(--hue) 90% 75%);
            --primary5: hsl(var(--hue) 90% 55%);
            --primary6: hsl(var(--hue) 90% 45%);

        }

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "IM Fell DW Pica SC", serif;
        }

        .main-wrapper {
            padding-top: 80px;
            padding-bottom: 40px;
        }

        .page-header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid rgba(15, 216, 80, 0.2);
        }

        .page-header h1 {
            font-size: var(--fs-xl);
            color: var(--color-text);
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--color-text-muted);
        }

        .works-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        #app {
            min-height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .back-btn {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 101;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(45, 122, 45, 0.1);
            border: 1px solid rgba(45, 122, 45, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(45, 122, 45, 0.2);
            border-color: rgba(45, 122, 45, 0.4);
            transform: scale(1.08);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--color-primary);
            stroke-width: 2;
            fill: none;
        }

        @media (max-width: 768px) {
            .back-btn {
                top: 70px;
                right: 16px;
                width: 38px;
                height: 38px;
            }

            .back-btn svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
