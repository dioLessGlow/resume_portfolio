<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平面设计作品 | 陈少辉</title>
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/intro.css">
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid&display=swap" rel="stylesheet">
    <style>
        * {
            border: 0;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --hue: 223deg;
            --gray1: hsl(var(--hue) 10% 95%);
            --gray9: hsl(var(--hue) 10% 15%);
            --black: hsl(0 0% 0%);
            --primary3: hsl(var(--hue) 90% 75%);
            --primary5: hsl(var(--hue) 90% 55%);
            --primary6: hsl(var(--hue) 90% 45%);
            --trans-dur: 0.3s;
            font-size: clamp(1.25rem, 1rem + 1.25vw, 2.5rem);
        }

        body {
            font-family: "Space Grotesk", sans-serif;
        }
    </style>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "IM Fell DW Pica SC", serif;
        }

        .main-wrapper {
            padding-top: 80px;
            padding-bottom: 40px;
        }
        
        .page-header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid rgba(15, 216, 80, 0.2);
        }

        .page-header h1 {
            font-size: var(--fs-xl);
            color: var(--color-text);
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--color-text-muted);
        }

        .works-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .work-item {
            background: rgba(15, 216, 80, 0.05);
            border: 1px solid rgba(15, 216, 80, 0.15);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .work-item:hover {
            transform: translateY(-5px);
            border-color: var(--color-primary);
        }

        .work-item .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .work-item h3 {
            font-size: var(--fs-md);
            color: var(--color-text);
            margin-bottom: 10px;
        }

        .work-item p {
            font-size: var(--fs-sm);
            color: var(--color-text-muted);
        }

        /* Polaroid 照片墙区域 */
        .poster-showcase {
            margin-top: 60px;
            text-align: center;
        }

        .poster-showcase h2 {
            font-size: var(--fs-lg);
            color: var(--color-text);
            margin-bottom: 30px;
        }

        /* React Polaroid App 容器 */
        #app {
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Photo grid layout */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            z-index: 2;
        }

        /* Aspect ratios */
        .aspect-4\/5 {
            aspect-ratio: 4 / 5;
        }

        .aspect-square {
            aspect-ratio: 1 / 1;
        }

        .shadow-sm {
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .bg-\[\#f5f5dc\] {
            background-color: #f5f5dc;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        .p-2 {
            padding: 8px;
        }

        .w-full {
            width: 100%;
        }

        .h-full {
            height: 100%;
        }

        .object-cover {
            object-fit: cover;
        }

        .absolute {
            position: absolute;
        }

        .inset-0 {
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }

        .relative {
            position: relative;
        }

        .mt-2 {
            margin-top: 8px;
        }

        /* Folder styles */
        .folder-container {
            position: relative;
            width: 160px;
            aspect-ratio: 5 / 4;
            border-radius: 12px;
        }

        .folder-container.collected {
            cursor: pointer;
        }

        .folder-bg {
            position: absolute;
            inset: 0;
            background-color: #c7d2fe;
            border-radius: inherit;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        .folder-front {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 66%;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 0 0 12px 12px;
            padding: 8px;
            z-index: 3;
        }

        /* Flex utilities */
        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .gap-8 {
            gap: 32px;
        }

        .items-center {
            align-items: center;
        }

        .py-8 {
            padding-top: 32px;
            padding-bottom: 32px;
        }

        .select-none {
            user-select: none;
        }

        /* Text */
        .text-sm {
            font-size: 14px;
        }

        .text-white {
            color: white;
        }

        /* 从旧版保留的基础样式 */
        .works-section {
            display: none;
        }

        /* 3D transform helper classes */
        .transform-3d {
            transform-style: preserve-3d;
        }

        .perspective-normal {
            perspective: 1000px;
        }

        .rotate-x-15 {
            transform: rotateX(-15deg);
        }

        .skew-x-5 {
            skewX:(-5deg);
        }

        .group:hover .folder-photos {
            transform: translateY(-20px);
        }

        .group:hover .folder-front {
            transform: rotateX(-15deg) skewX(-5deg);
        }

        /* 文件夹交互效果 */
        .folder-photos {
            transition: transform 0.3s ease;
        }

        .folder-front {
            transition: transform 0.3s ease;
            transform-origin: bottom center;
        }

        /* 照片阴影效果 */
        .photo-shadow {
            box-shadow: inset 0 8px 20px rgba(0, 0, 0, 0.15),
                inset 0 -8px 20px rgba(0, 0, 0, 0.15),
                inset 8px 0 20px rgba(0, 0, 0, 0.1),
                inset -8px 0 20px rgba(0, 0, 0, 0.1);
        }

        /* 文字阴影 */
        .text-shadow-sm {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div id="loader-container"></div>
    <div id="header-container"></div>

    <div class="main-wrapper">
        
        <div class="page-header">
            <h1>平面设计作品</h1>
            <p>品牌视觉、海报、宣传物料设计</p>
        </div>

        <div class="works-container">
            <!-- React Polaroid 照片墙 - 点击照片收集到文件夹 -->
            <div class="poster-showcase">
                <h2>海报作品展示 · 点击照片收集到文件夹</h2>
                <div id="app"></div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="js/components.js"></script>

    <!-- React Polaroid App -->
    <script type="module">
        import React, { useState, useEffect } from "https://esm.sh/react@19";
        import { createRoot } from "https://esm.sh/react-dom@19/client";
        import { motion, AnimatePresence } from "https://esm.sh/motion/react";

        const PHOTOS = [
            { name: '春', src: 'images/projects/春.jpg' },
            { name: '禁止带吃', src: 'images/projects/禁止吃-海报.jpg' },
            { name: '夏', src: 'images/projects/夏.jpg' },
            { name: '秋', src: 'images/projects/秋.jpg' },
            { name: '绿色出行', src: 'images/projects/绿色出行-海报.jpg' },
            { name: '冬', src: 'images/projects/冬.jpg' },

        ];

        const seededRandom = (seed) => {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        };

        const Polaroid = ({ src, name, style, transition = {} }) => {
            return (
                React.createElement(motion.div, {
                    className: "polaroid-card",
                    transition: transition,
                    style: {
                        ...style,
                        aspectRatio: '4/5',
                        backgroundColor: '#f5f5dc',
                        padding: '8px',
                        cursor: 'pointer',
                        boxShadow: '0 1px 2px 0 rgba(0, 0, 0, 0.05)'
                    },
                    layoutId: `photo-${name}`
                },
                    React.createElement("div", {
                        className: "img-container",
                        style: {
                            width: '100%',
                            aspectRatio: '4/5',
                            position: 'relative',
                            overflow: 'hidden'
                        }
                    },
                        React.createElement("img", {
                            src: src,
                            alt: name,
                            style: {
                                width: '100%',
                                height: '100%',
                                objectFit: 'cover'
                            }
                        }),
                        React.createElement("div", {
                            style: {
                                position: 'absolute',
                                inset: 0,
                                boxShadow: 'inset 0 8px 20px rgba(0,0,0,0.15), inset 0 -8px 20px rgba(0,0,0,0.15), inset 8px 0 20px rgba(0,0,0,0.1), inset -8px 0 20px rgba(0,0,0,0.1)'
                            }
                        })
                    ),
                    React.createElement("div", {
                        style: { marginTop: '8px', fontFamily: '"IM Fell DW Pica SC", serif' }
                    }, name)
                )
            );
        };

        const App = () => {
            const [collected, setCollected] = React.useState(false);

            return (
                React.createElement("div", {
                    style: {
                        fontFamily: '"IM Fell DW Pica SC", serif',
                        fontSize: '16px',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        gap: '32px',
                        padding: '32px 0',
                        userSelect: 'none'
                    }
                },
                    /* 照片网格 */
                    React.createElement("div", {
                        style: {
                            display: 'grid',
                            gridTemplateColumns: 'repeat(3, 1fr)',
                            gap: '16px',
                            zIndex: 2
                        },
                        onClick: () => setCollected(true)
                    },
                        PHOTOS.map((p, i) =>
                            React.createElement(Polaroid, {
                                key: p.name,
                                src: p.src,
                                name: p.name,
                                style: { width: '120px' },
                                transition: { type: 'spring', bounce: 0.1, delay: i * 0.05 }
                            })
                        )
                    ),

                    /* 文件夹 */
                    React.createElement("div", {
                        style: {
                            position: 'relative',
                            width: '160px',
                            aspectRatio: '5/4',
                            borderRadius: '12px',
                            cursor: collected ? 'pointer' : 'default',
                            transition: 'transform 0.25s'
                        },
                        onClick: () => setCollected(false)
                    },
                        /* 文件夹背景 */
                        React.createElement("div", {
                            style: {
                                position: 'absolute',
                                inset: 0,
                                backgroundColor: '#c7d2fe',
                                borderRadius: '12px',
                                boxShadow: '0 4px 6px rgba(0,0,0,0.1)',
                                zIndex: 1
                            }
                        },
                            /* 文件夹里的照片 */
                            React.createElement("div", {
                                style: {
                                    position: 'absolute',
                                    inset: 0,
                                    transition: 'transform 0.3s',
                                    transform: collected ? 'translateY(-20px)' : 'translateY(0)'
                                }
                            },
                                collected && PHOTOS.map((p, i) =>
                                    React.createElement(Polaroid, {
                                        key: p.name,
                                        src: p.src,
                                        name: p.name,
                                        transition: { type: 'spring', bounce: 0.2, delay: i * 0.05 },
                                        style: {
                                            rotate: `${seededRandom(i) * 20 - 10}deg`,
                                            width: '100px',
                                            position: 'absolute',
                                            left: 0,
                                            right: 0,
                                            bottom: '24px',
                                            margin: '0 auto'
                                        }
                                    })
                                )
                            )
                        ),
                        /* 文件夹封面 */
                        React.createElement("div", {
                            style: {
                                position: 'absolute',
                                left: 0,
                                bottom: 0,
                                width: '100%',
                                height: '66%',
                                backgroundColor: 'rgba(255,255,255,0.2)',
                                backdropFilter: 'blur(4px)',
                                borderRadius: '0 0 12px 12px',
                                padding: '8px',
                                zIndex: 3
                            }
                        },
                            React.createElement("div", {
                                style: {
                                    fontSize: '14px',
                                    color: 'white',
                                    textShadow: '0 1px 2px rgba(0,0,0,0.3)'
                                }
                            }, "memories")
                        )
                    )
                )
            );
        };

        const root = createRoot(document.getElementById("app"));
        root.render(React.createElement(App));
    </script>
</body>

</html>
