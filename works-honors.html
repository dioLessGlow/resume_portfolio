<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荣誉墙 | 陈少辉</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/loader.css">
    <style>
        .page-header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid rgba(15, 216, 80, 0.2);
        }
        .page-header h1 {
            font-size: var(--fs-xl);
            color: var(--color-text);
            margin-bottom: 10px;
        }
        .page-header p {
            color: var(--color-text-muted);
        }
    </style>
</head>

<body>
    <div id="loader-container"></div>
    <div id="header-container"></div>
    
    <div class="main-wrapper">
        
        <div class="container">
            <div class="page-header">
                <h1>荣誉墙</h1>
                <p>获奖与成就</p>
            </div>
            
            <h2 class="section-title" style="margin-top: 40px;"><span class="title-index">01.</span> 大二 (2025)</h2>
            <div class="awards-grid" style="margin-bottom: 40px;">
                <div class="award-card">
                    <span class="award-icon">🏆</span>
                    <div class="award-info">
                        <h3>广东省技能大赛</h3>
                        <p>应用软件系统开发 <strong>省二等奖</strong></p>
                    </div>
                </div>
                <div class="award-card">
                    <span class="award-icon">🥈</span>
                    <div class="award-info">
                        <h3>智慧书海竞赛</h3>
                        <p>银翼奖（<strong>全国第二</strong>）</p>
                    </div>
                </div>
                <div class="award-card">
                    <span class="award-icon">📊</span>
                    <div class="award-info">
                        <h3>综测成绩</h3>
                        <p>院专业<strong>排名第二</strong></p>
                    </div>
                </div>
            </div>
            
            <h2 class="section-title"><span class="title-index">02.</span> 大一 (2024)</h2>
            <div class="awards-grid">
                <div class="award-card">
                    <span class="award-icon">📊</span>
                    <div class="award-info">
                        <h3>综测成绩</h3>
                        <p>院<strong>排名第二</strong></p>
                    </div>
                </div>
                <div class="award-card">
                    <span class="award-icon">🏺</span>
                    <div class="award-info">
                        <h3>三灶鹤舞</h3>
                        <p>校级<strong>三等奖</strong></p>
                    </div>
                </div>
            </div>
            
            <h2 class="section-title" style="margin-top: 40px;"><span class="title-index">03.</span> 技能证书</h2>
            <div class="certificates-grid">
                <div class="cert-card">
                    <span class="cert-icon">🔐</span>
                    <div class="cert-info">
                        <h3>深信服认证</h3>
                        <p>助理工程师</p>
                    </div>
                </div>
                <div class="cert-card">
                    <span class="cert-icon">📝</span>
                    <div class="cert-info">
                        <h3>英语CET-4</h3>
                        <p>证书</p>
                    </div>
                </div>
                <div class="cert-card">
                    <span class="cert-icon">💻</span>
                    <div class="cert-info">
                        <h3>计算机等级考试</h3>
                        <p>二级</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="footer-container"></div>
    
    <script src="js/components.js"></script>
</body>

</html>
