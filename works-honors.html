<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荣誉墙 | 陈少辉</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/intro.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        /* ===== 荣誉墙 3D 轮播样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #2d7a2d;
            --color-bg: #fdfbf7;
            --color-text: #1a5f1a;
            --color-text-muted: #5a9a5a;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            -webkit-font-smoothing: antialiased;
        }

        /* 轮播容器 */
        .honors-slider {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #f0f7f0 0%, #fdfbf7 50%, #e8f5e9 100%);
            position: relative;
        }

        /* 背景装饰 */
        .honors-slider::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(45, 122, 45, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(45, 122, 45, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 40% 40%, rgba(45, 122, 45, 0.03) 0%, transparent 30%);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .slider__header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(16px, 4vw, 32px);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .slider__label {
            font-size: clamp(12px, 2vw, 14px);
            letter-spacing: 2px;
            color: var(--color-primary);
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.8;
        }

        /* Body */
        .slider__body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 clamp(16px, 4vw, 40px) clamp(24px, 5vw, 48px);
            min-height: 0;
            position: relative;
        }

        /* Left: 标题 + 信息 */
        .slider__left {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 4;
            text-align: center;
            padding-bottom: clamp(16px, 3vw, 32px);
        }

        .slider__title {
            font-size: clamp(48px, 12vw, 160px);
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1.1;
            letter-spacing: -0.02em;
            overflow: hidden;
            position: relative;
            margin-bottom: clamp(8px, 2vw, 16px);
        }

        .title-line {
            position: relative;
        }

        .slider__title span {
            display: inline-block;
            will-change: transform;
        }

        .slider__footer {
            flex-shrink: 0;
        }

        .slider__description {
            font-size: clamp(12px, 2vw, 16px);
            color: var(--color-text-muted);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .slider__description .highlight {
            color: var(--color-primary);
            font-weight: 600;
        }

        .slider__meta {
            font-size: clamp(10px, 1.5vw, 12px);
            color: var(--color-text-muted);
            opacity: 0.7;
            margin-top: 8px;
        }

        /* Right: 卡片堆叠 */
        .slider__right {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        .slider__images {
            width: 100%;
            height: 100%;
            position: relative;
            max-width: 500px;
        }

        .slider__slide {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 55%;
            aspect-ratio: 4/5;
            overflow: hidden;
            will-change: transform, filter, opacity;
            contain: layout style;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .slider__slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.95) saturate(1.1);
        }

        /* 卡片上的标题 */
        .slide-title-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: clamp(12px, 3vw, 24px);
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            color: white;
            text-align: center;
        }

        .slide-title-overlay h3 {
            font-size: clamp(12px, 2vw, 18px);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .slide-title-overlay p {
            font-size: clamp(10px, 1.5vw, 14px);
            opacity: 0.8;
        }

        /* 徽章 */
        .honor-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: clamp(10px, 1.2vw, 12px);
            font-weight: 600;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .honor-badge.gold {
            background: linear-gradient(135deg, #ffd700, #ffb700);
            color: #5a4a00;
        }

        .honor-badge.silver {
            background: linear-gradient(135deg, #e8e8e8, #c0c0c0);
            color: #4a4a4a;
        }

        .honor-badge.bronze {
            background: linear-gradient(135deg, #cd7f32, #b87333);
            color: white;
        }

        .honor-badge.default {
            background: linear-gradient(135deg, var(--color-primary), #3d9a3d);
            color: white;
        }

        /* 导航指示器 */
        .slider__nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: clamp(12px, 3vw, 24px) 0;
            position: relative;
            z-index: 10;
        }

        .nav-dot {
            width: clamp(8px, 1.5vw, 12px);
            height: clamp(8px, 1.5vw, 12px);
            border-radius: 50%;
            background: rgba(45, 122, 45, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot:hover {
            background: rgba(45, 122, 45, 0.4);
        }

        .nav-dot.active {
            background: var(--color-primary);
            transform: scale(1.3);
        }

        /* 底部提示 */
        .scroll-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--color-text-muted);
            font-size: 12px;
            opacity: 0.6;
            z-index: 100;
        }

        .scroll-hint svg {
            width: 24px;
            height: 24px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* 响应式 */
        @media screen and (min-width: 768px) {
            .slider__header {
                padding: 32px 48px;
            }

            .slider__body {
                padding: 0 48px 48px;
            }

            .slider__slide {
                width: 50%;
            }
        }

        @media screen and (min-width: 1024px) {
            .slider__body {
                flex-direction: row;
            }

            .slider__left {
                width: 50%;
                flex-shrink: 0;
                z-index: auto;
                text-align: left;
                justify-content: center;
            }

            .slider__title {
                margin-top: auto;
                margin-bottom: auto;
            }

            .slider__description {
                margin: 0;
            }

            .slider__right {
                position: static;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 0;
                pointer-events: auto;
            }

            .slider__slide {
                width: 60%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .slider__slide,
            .slider__title span {
                will-change: auto;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <section class="honors-slider" ref="sliderEl">
            <!-- Header -->
            <div class="slider__header">
                <span class="slider__label">荣誉墙 · 记录每一个努力的瞬间</span>
            </div>

            <!-- Body -->
            <div class="slider__body">
                <!-- Left: 标题 + 信息 -->
                <div class="slider__left">
                    <h2 class="slider__title" aria-live="polite" ref="titleEl">
                        <div class="title-line" ref="titleLineRef">
                            <span v-for="(char, i) in currentHonor.name.split('')" :key="i">
                                {{ char === ' ' ? '\u00A0' : char }}
                            </span>
                        </div>
                    </h2>
                    <div class="slider__footer">
                        <p class="slider__description">
                            <span class="highlight">{{ currentHonor.year }}</span> · {{ currentHonor.category }}
                            <br>
                            {{ currentHonor.description }}
                        </p>
                        <p class="slider__meta">滑动或按方向键切换 · 共 {{ honors.length }} 项荣誉</p>
                    </div>
                </div>

                <!-- Right: 卡片堆叠 -->
                <div class="slider__right">
                    <div class="slider__images" ref="imagesEl">
                        <div v-for="slide in visibleSlides" :key="slide.index" class="slider__slide"
                            :style="getSlideStyle(slide)">
                            <img :src="honors[slide.index].image" :alt="honors[slide.index].name">
                            <span class="honor-badge" :class="honors[slide.index].badge">
                                {{ honors[slide.index].badgeText }}
                            </span>
                            <div class="slide-title-overlay">
                                <h3>{{ honors[slide.index].name }}</h3>
                                <p>{{ honors[slide.index].subtitle }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 导航点 -->
            <div class="slider__nav">
                <div v-for="(honor, index) in honors" :key="index" 
                     class="nav-dot" 
                     :class="{ active: current === index }"
                     @click="goTo(index)">
                </div>
            </div>
        </section>

        <div class="scroll-hint">
            <span>滑动切换荣誉</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;

        createApp({
            setup() {
                /* ========================================
                   荣誉数据
                ======================================== */
                const honors = [
                    {
                        name: '省二等奖',
                        subtitle: '广东省技能大赛',
                        year: '2025',
                        category: '专业竞赛',
                        description: '广东省职业院校技能大赛-应用软件系统开发赛项（高职组）',
                        image: 'images/honors/1.jpg',
                        badge: 'gold',
                        badgeText: '省二等奖'
                    },
                    {
                        name: '银翼奖',
                        subtitle: '智慧书海全国赛',
                        year: '2025',
                        category: '创新创业',
                        description: '《智慧书海，星河创意》银翼奖，全国第二名',
                        image: 'images/honors/2.jpg',
                        badge: 'gold',
                        badgeText: '全国第二'
                    },
                    {
                        name: '综测第二',
                        subtitle: '广东科学技术职业学院',
                        year: '2025',
                        category: '学业成绩',
                        description: '综测成绩院系排名第二，连续两年获此殊荣',
                        image: 'images/honors/3.jpg',
                        badge: 'silver',
                        badgeText: '综测第二'
                    },
                    {
                        name: '持之以恒奖',
                        subtitle: '学院荣誉',
                        year: '2025',
                        category: '综合素质',
                        description: '我院"持之以恒奖"，表彰持续努力与进步',
                        image: 'images/honors/7.jpg',
                        badge: 'default',
                        badgeText: '综合素质'
                    },
                    {
                        name: '阅读达人',
                        subtitle: '学院荣誉',
                        year: '2025',
                        category: '综合素质',
                        description: '我院"阅读达人奖"，热爱阅读与学习',
                        image: 'images/honors/8.jpg',
                        badge: 'default',
                        badgeText: '阅读达人'
                    },
                    {
                        name: '深信服认证',
                        subtitle: '助理工程师',
                        year: '2024',
                        category: '专业认证',
                        description: '深信服认证助理工程师，网络安全领域专业认证',
                        image: 'images/honors/4.jpg',
                        badge: 'default',
                        badgeText: '认证'
                    },
                    {
                        name: 'CET-4',
                        subtitle: '英语等级考试',
                        year: '2024',
                        category: '语言能力',
                        description: '全国大学英语四级考试通过',
                        image: 'images/honors/5.jpg',
                        badge: 'default',
                        badgeText: '英语四级'
                    },
                    {
                        name: '三灶鹤舞',
                        subtitle: '校级文化比赛',
                        year: '2024',
                        category: '文化活动',
                        description: '《三灶鹤舞》校级文化比赛三等奖',
                        image: 'images/honors/6.jpg',
                        badge: 'bronze',
                        badgeText: '校级三等奖'
                    },
                ];

                const AUTOPLAY_DELAY = 5000;

                /* ========================================
                   STATE
                ======================================== */
                const sliderEl = ref(null);
                const titleEl = ref(null);
                const titleLineRef = ref(null);
                const imagesEl = ref(null);

                const current = ref(0);
                const animating = ref(false);
                const reducedMotion = ref(false);
                const autoPlayId = ref(null);
                const visibleSlides = ref([]);

                const total = honors.length;

                const currentHonor = computed(() => honors[current.value]);

                /* ========================================
                   HELPERS
                ======================================== */
                const mod = (n) => ((n % total) + total) % total;

                const preload = () => {
                    honors.forEach((h) => {
                        const img = new Image();
                        img.src = h.image;
                    });
                };

                /* ========================================
                   卡片位置 (3D 堆叠)
                ======================================== */
                const positions = [
                    { x: -0.35, y: -0.95, rot: -30, s: 1.35, b: 16, o: 0 },
                    { x: -0.18, y: -0.50, rot: -15, s: 1.15, b: 8, o: 0.55 },
                    { x: 0, y: 0, rot: 0, s: 1, b: 0, o: 1 },
                    { x: -0.06, y: 0.50, rot: 15, s: 0.75, b: 6, o: 0.55 },
                    { x: -0.12, y: 0.95, rot: 30, s: 0.55, b: 14, o: 0 },
                ];

                const getSlideProps = (step) => {
                    const h = imagesEl.value?.offsetHeight || window.innerHeight;
                    const absStep = Math.abs(step);
                    const idx = Math.max(0, Math.min(4, step + 2));
                    const p = positions[idx];

                    return {
                        x: p.x * h,
                        y: p.y * h,
                        rotation: p.rot,
                        scale: p.s,
                        blur: p.b,
                        opacity: p.o,
                        zIndex: absStep === 0 ? 3 : absStep === 1 ? 2 : 1,
                    };
                };

                const getSlideStyle = (slide) => {
                    const props = getSlideProps(slide.step);
                    return {
                        transform: `translate(-50%, -50%) translate(${props.x}px, ${props.y}px) rotate(${props.rotation}deg) scale(${props.scale})`,
                        opacity: props.opacity,
                        filter: `blur(${props.blur}px)`,
                        zIndex: props.zIndex,
                    };
                };

                /* ========================================
                   CAROUSEL
                ======================================== */
                const buildCarousel = () => {
                    const slides = [];
                    for (let step = -1; step <= 1; step++) {
                        slides.push({
                            index: mod(current.value + step),
                            step,
                        });
                    }
                    visibleSlides.value = slides;
                };

                /* ========================================
                   AUTOPLAY
                ======================================== */
                const startAutoPlay = () => {
                    stopAutoPlay();
                    autoPlayId.value = setInterval(() => {
                        if (!animating.value) go('next');
                    }, AUTOPLAY_DELAY);
                };

                const stopAutoPlay = () => {
                    if (autoPlayId.value) {
                        clearInterval(autoPlayId.value);
                        autoPlayId.value = null;
                    }
                };

                /* ========================================
                   标题动画
                ======================================== */
                const animateTitle = async (newText, direction) => {
                    if (!titleEl.value) return;

                    const h = titleEl.value.offsetHeight;
                    const dir = direction === 'next' ? 1 : -1;

                    const oldLine = titleLineRef.value;
                    if (!oldLine) return;

                    const oldChars = [...oldLine.querySelectorAll('span')];

                    const newLine = document.createElement('div');
                    newLine.className = 'title-line';
                    newLine.style.cssText = 'position:absolute;top:0;left:0;width:100%';
                    [...newText].forEach((ch) => {
                        const span = document.createElement('span');
                        span.textContent = ch === ' ' ? '\u00A0' : ch;
                        newLine.appendChild(span);
                    });
                    titleEl.value.appendChild(newLine);

                    const newChars = [...newLine.querySelectorAll('span')];
                    gsap.set(newChars, { y: h * dir });

                    const duration = reducedMotion.value ? 0.01 : 1;
                    const stagger = reducedMotion.value ? 0 : 0.04;

                    titleEl.value.style.height = h + 'px';
                    oldLine.style.cssText = 'position:absolute;top:0;left:0;width:100%';

                    const tl = gsap.timeline({
                        onComplete: () => {
                            oldLine.remove();
                            newLine.style.cssText = '';
                            gsap.set(newChars, { clearProps: 'all' });
                            titleEl.value.style.height = '';
                            titleLineRef.value = newLine;
                        },
                    });

                    tl.to(oldChars, {
                        y: -h * dir,
                        stagger,
                        duration,
                        ease: 'expo.inOut',
                    }, 0);

                    tl.to(newChars, {
                        y: 0,
                        stagger,
                        duration,
                        ease: 'expo.inOut',
                    }, 0);

                    return tl;
                };

                /* ========================================
                   卡片动画
                ======================================== */
                const animateCarousel = (direction) => {
                    if (!imagesEl.value || imagesEl.value.offsetHeight === 0) {
                        return gsap.timeline();
                    }

                    const shift = direction === 'next' ? -1 : 1;
                    const enterStep = direction === 'next' ? 2 : -2;
                    const newIdx = direction === 'next'
                        ? mod(current.value + 2)
                        : mod(current.value - 2);

                    visibleSlides.value.push({
                        index: newIdx,
                        step: enterStep,
                    });

                    visibleSlides.value.forEach((s) => {
                        s.step += shift;
                    });

                    const duration = reducedMotion.value ? 0.01 : 1.2;

                    const tl = gsap.timeline({
                        onComplete: () => {
                            visibleSlides.value = visibleSlides.value.filter((s) => Math.abs(s.step) < 2);
                        },
                    });

                    nextTick(() => {
                        const slideEls = imagesEl.value.querySelectorAll('.slider__slide');
                        slideEls.forEach((el, i) => {
                            const slide = visibleSlides.value[i];
                            if (!slide) return;
                            const props = getSlideProps(slide.step);
                            el.style.zIndex = props.zIndex;

                            tl.to(el, {
                                x: props.x,
                                y: props.y,
                                rotation: props.rotation,
                                scale: props.scale,
                                opacity: props.opacity,
                                filter: `blur(${props.blur}px)`,
                                duration,
                                ease: 'power3.inOut',
                            }, 0);
                        });
                    });

                    return tl;
                };

                /* ========================================
                   过渡动画
                ======================================== */
                const go = (direction) => {
                    if (animating.value) return;
                    animating.value = true;
                    startAutoPlay();

                    let nextIdx;
                    if (direction === 'next') {
                        nextIdx = mod(current.value + 1);
                    } else if (direction === 'prev') {
                        nextIdx = mod(current.value - 1);
                    } else {
                        nextIdx = direction;
                    }

                    const master = gsap.timeline({
                        onComplete: () => {
                            current.value = nextIdx;
                            animating.value = false;
                            buildCarousel();
                        },
                    });

                    master.add(animateTitle(honors[nextIdx].name, direction === 'next' ? 'next' : 'prev'), 0);
                    master.add(animateCarousel(direction === 'next' ? 'next' : 'prev'), 0);
                };

                const goTo = (index) => {
                    if (animating.value || index === current.value) return;
                    const diff = index - current.value;
                    
                    if (diff > 0) {
                        for (let i = 0; i < diff; i++) {
                            go('next');
                        }
                    } else {
                        for (let i = 0; i < Math.abs(diff); i++) {
                            go('prev');
                        }
                    }
                };

                /* ========================================
                   事件处理
                ======================================== */
                let touchStartY = 0;

                const onWheel = (e) => {
                    if (animating.value) return;
                    go(e.deltaY > 0 ? 'next' : 'prev');
                };

                const onTouchStart = (e) => {
                    touchStartY = e.touches[0].clientY;
                };

                const onTouchEnd = (e) => {
                    if (animating.value) return;
                    const diff = touchStartY - e.changedTouches[0].clientY;
                    if (Math.abs(diff) < 40) return;
                    go(diff > 0 ? 'next' : 'prev');
                };

                const onKeyDown = (e) => {
                    if (animating.value) return;
                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') go('next');
                    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') go('prev');
                };

                const onResize = () => {
                    if (!animating.value && imagesEl.value?.offsetHeight > 0) {
                        visibleSlides.value = [...visibleSlides.value];
                    }
                };

                const onVisibilityChange = () => {
                    if (document.visibilityState === 'hidden') {
                        animating.value = false;
                        stopAutoPlay();
                    } else {
                        startAutoPlay();
                    }
                };

                /* ========================================
                   UTILITIES
                ======================================== */
                const throttle = (fn, limit) => {
                    let waiting = false;
                    return (...args) => {
                        if (!waiting) {
                            fn(...args);
                            waiting = true;
                            setTimeout(() => { waiting = false; }, limit);
                        }
                    };
                };

                const debounce = (fn, wait) => {
                    let timeout;
                    return (...args) => {
                        clearTimeout(timeout);
                        timeout = setTimeout(() => fn(...args), wait);
                    };
                };

                const throttledWheel = throttle(onWheel, 1500);
                const throttledTouchEnd = throttle(onTouchEnd, 1500);
                const debouncedResize = debounce(onResize, 300);

                /* ========================================
                   LIFECYCLE
                ======================================== */
                onMounted(() => {
                    reducedMotion.value = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    preload();
                    buildCarousel();

                    window.addEventListener('wheel', throttledWheel, { passive: true });
                    window.addEventListener('touchstart', onTouchStart, { passive: true });
                    window.addEventListener('touchend', throttledTouchEnd, { passive: true });
                    window.addEventListener('keydown', onKeyDown);
                    window.addEventListener('resize', debouncedResize, { passive: true });
                    document.addEventListener('visibilitychange', onVisibilityChange);

                    startAutoPlay();
                });

                onUnmounted(() => {
                    stopAutoPlay();
                    window.removeEventListener('wheel', throttledWheel);
                    window.removeEventListener('touchstart', onTouchStart);
                    window.removeEventListener('touchend', throttledTouchEnd);
                    window.removeEventListener('keydown', onKeyDown);
                    window.removeEventListener('resize', debouncedResize);
                    document.removeEventListener('visibilitychange', onVisibilityChange);
                });

                return {
                    sliderEl,
                    titleEl,
                    titleLineRef,
                    imagesEl,
                    current,
                    honors,
                    visibleSlides,
                    currentHonor,
                    getSlideStyle,
                    goTo,
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
