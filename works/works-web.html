            margin: 0 auto;
            pointer-events: none;
        }

        .snack span {
            display: block;
            margin-top: 0.3rem;
            font-family: "Inter", "Noto Sans SC", sans-serif;

            border-color: rgba(0, 0, 0, 0.2);
            background: rgba(0, 0, 0, 0.06);

        .snack:disabled {
            opacity: 0.6;

            transform: none;
        }

        .pudgy-container {
            margin: 1rem auto 0;
            width: clamp(150px, 35vw, 230px);

    <script type="module" src="../js/components.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const snacks = document.querySelectorAll(".snack");
            const pudgy = document.getElementById("pudgy");
            const body = document.body;
            const reaction = document.getElementById("reactionText");

            // 统一使用本地动图（480px WebP，比原始 GIF 小 97%，且不依赖境外 CDN）
            const yesGif = "../images/pudgy/isyes.webp";
            const noGif = "../images/pudgy/no.webp";
            const idleGif = "../images/pudgy/idle.webp";

            // WebP 时长 bug 已在文件内修复，不再需要时间戳破缓存。
            // 双版本号交替：URL 每次都变 → 强制从头重播（防移动端同 src 不重绘的怪癖）；
            // 但只有两个固定值 → 首次下载后全部命中缓存，点击切换零下载、零白闪
            const PUDGY_VA = "?v=20261113a";
            const PUDGY_VB = "?v=20261113b";
            let pudgyFlip = false;
            function playPudgy(src) {
                pudgy.src = src + (pudgyFlip ? PUDGY_VA : PUDGY_VB);
                pudgyFlip = !pudgyFlip;
            }

            // 定时器引用，防止竞态条件
            let jumpTimer = null;
            let resetTimer = null;
            let isAnimating = false;

            // 预加载全部 6 个 URL（3 动画 × 2 版本），与实际请求完全一致，保证缓存命中
            function preloadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = src;
                });
            }

            // 首屏只等 idle 的一个版本（58KB）→ 企鹅立即出现；其余 5 个 URL 后台预热。
            // 旧写法 Promise.all 等 6 个 URL 全下完（约 578KB）才显示，4G 节流下 LCP 曾达 13s。
            function showIdle(v) {
                pudgy.src = idleGif + v;
                pudgyFlip = (v === PUDGY_VA);
                pudgy.classList.add("ready");
            }
            preloadImage(idleGif + PUDGY_VB)
                .then(() => showIdle(PUDGY_VB))
                .catch(() => {
                    // 即使加载失败也显示，避免空白（切换时另一版本已由后台预热兜底）
                    showIdle(PUDGY_VA);
                });
            // 后台预热剩余 5 个 URL（不阻塞首屏），与实际请求完全一致，保证点击切换零下载
            [PUDGY_VA, PUDGY_VB].forEach((v) => {
                preloadImage(yesGif + v);
                preloadImage(noGif + v);
            });
            preloadImage(idleGif + PUDGY_VA);

            snacks.forEach((snack) => {
                snack.addEventListener("click", (e) => {
                    if (isAnimating) return;

                    const response = snack.dataset.response;
                    const isTrue = response === "true";
                    const name = snack.dataset.snack;
                    const href = snack.getAttribute("href");

                    // 阻止默认跳转，先展示动画
                    e.preventDefault();
                    isAnimating = true;

                    // 清除旧定时器，防止竞态条件
                    clearTimeout(jumpTimer);
                    clearTimeout(resetTimer);

                    // 禁用所有按钮，防止连续点击
                    snacks.forEach(s => {
                        if (s.tagName === "BUTTON") s.disabled = true;
                        s.style.pointerEvents = "none";
                    });

                    // 重置状态
                    body.classList.remove("true", "false");
                    reaction.style.opacity = 1;
                    reaction.innerText = "正在评估...";

                    // 短暂延迟后播放结果
                    setTimeout(() => {
                        if (isTrue) {
                            body.classList.add("true");
                            playPudgy(yesGif);
                            reaction.innerText = `通过 → ${name} 已批准`;
                        } else {
                            body.classList.add("false");
                            playPudgy(noGif);
                            reaction.innerText = `拒绝 → ${name} 被驳回`;
                        }
                    }, 400);

                    // 动画结束后的处理
                    if (isTrue) {
                        jumpTimer = setTimeout(() => {
                            window.location.href = href;
                        }, 2100);
                    } else {
                        resetTimer = setTimeout(() => {
                            playPudgy(idleGif);
                            reaction.style.opacity = 0;
                            body.classList.remove("false");
                            isAnimating = false;
                            // 恢复交互
                            snacks.forEach(s => {
                                if (s.tagName === "BUTTON") s.disabled = false;
                                s.style.pointerEvents = "";
                            });
                        }, 2100);
                    }
                });
            });

            // 从子页面返回时可能命中往返缓存（bfcache）：页面以跳转前的状态原样恢复，
            // 此时 isAnimating 仍为 true 且再无定时器重置 → 八个零食永久点不动。
            // 恢复时重置全部交互与视觉状态
            window.addEventListener("pageshow", (e) => {
                if (!e.persisted) return; // 全新加载走正常初始化，无需处理
                isAnimating = false;
                clearTimeout(jumpTimer);
                clearTimeout(resetTimer);
                snacks.forEach(s => {
                    if (s.tagName === "BUTTON") s.disabled = false;
                    s.style.pointerEvents = "";
                });
                body.classList.remove("true", "false");
                reaction.style.opacity = 0;
                playPudgy(idleGif);
            });
        });

        const observer = document.getElementById("observerText");

        const lines = [
            "正在观察输入...",
            "正在处理意图...",
            "信号已接收。",
            "正在评估选择...",
            "输入并不能保证结果。",
            "检测到模式。",
            "重新评估中...",
            "决策待定...",
            "并非所有输入都是平等的。",
            "系统仍未被说服。"
        ];

        let index = 0;

        function rotateObserver() {
            observer.style.opacity = 0;

            setTimeout(() => {
                observer.textContent = lines[index];
                observer.style.opacity = 1;

                index = (index + 1) % lines.length;
            }, 400);
        }

        // 开始轮播
        setInterval(rotateObserver, 3000);

        // 初始触发
        rotateObserver();
    </script>
    <script src="../js/back-transition.js"></script>
