<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>益智小游戏 | 陈少辉</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/intro.css">
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid&display=swap" rel="stylesheet">
    <style>
        * {
            border: 0;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-primary: #2d7a2d;
            --color-bg: #fdfbf7;
            --color-text: #1a5f1a;
            --color-text-muted: #5a9a5a;
            --fs-xs: 10px;
            --fs-sm: 12px;
            --fs-base: 14px;
            --fs-md: 16px;
            --fs-lg: 20px;
            --fs-xl: 28px;
            --wheel-max: 600px;
            --wheel-width: min(90vw, var(--wheel-max));
            --item-size-min: 70px;
            --item-size-vw: 15vw;
            --item-size-max: 100px;
        }

        body {
            background: var(--color-bg);
            font-family: 'Space Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .main-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
            padding-bottom: 20px;
        }

        .game-wheel-section {
            position: relative;
            margin: 0 auto;
            width: var(--wheel-width);
            max-width: 600px;
            aspect-ratio: 1 / 1;
            overflow: visible;
            touch-action: none;
        }

        .game-wheel {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            transform-origin: 50% 50%;
            will-change: transform;
        }

        .game-wheel .game-item {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(var(--item-size-min), var(--item-size-vw), var(--item-size-max));
            aspect-ratio: 1 / 1;
            transform-origin: 0 0;
            display: grid;
            place-items: center;
            text-decoration: none;
            transition: filter 0.3s ease;
            will-change: transform;
        }

        .game-wheel .game-item:hover {
            filter: brightness(1.2) drop-shadow(0 4px 12px rgba(45, 122, 45, 0.3));
        }

        .game-wheel .game-item:hover .icon {
            transform: scale(1.2);
        }

        .game-wheel .game-item .icon {
            font-size: 2.8rem;
            color: var(--color-primary, #2d7a2d);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: none;
            border-radius: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-wheel .game-item .name {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: var(--fs-xs);
            color: var(--color-text);
            white-space: nowrap;
            font-weight: 600;
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        .wheel-center h2 {
            font-size: var(--fs-xl);
            color: var(--color-text);
            margin: 0;
            font-weight: 700;
        }

        .wheel-center p {
            font-size: var(--fs-sm);
            color: var(--color-text-muted);
            margin-top: 6px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            :root {
                --wheel-width: min(92vw, 380px);
                --item-size-min: 48px;
                --item-size-vw: 16vw;
                --item-size-max: 64px;
                --fs-xl: 22px;
                --fs-sm: 11px;
                --fs-xs: 9px;
            }

            .main-wrapper {
                padding-top: 60px;
                padding-bottom: 24px;
            }

            .game-wheel-section {
                margin: 20px auto;
                max-width: 380px;
            }

            .game-wheel .game-item .icon {
                font-size: 2rem;
            }

            .game-wheel .game-item .name {
                font-size: var(--fs-xs);
                bottom: -22px;
            }

            .wheel-center h2 {
                font-size: var(--fs-xl);
            }

            .wheel-center p {
                font-size: var(--fs-sm);
                margin-top: 4px;
            }
        }

        @media (max-width: 380px) {
            :root {
                --wheel-width: 90vw;
                --item-size-min: 42px;
                --item-size-vw: 15vw;
                --item-size-max: 56px;
                --fs-xl: 18px;
            }

            .game-wheel .game-item .icon {
                font-size: 1.6rem;
            }

            .game-wheel .game-item .name {
                bottom: -18px;
                font-size: 8px;
            }
        }

        .back-btn {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 101;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(45, 122, 45, 0.1);
            border: 1px solid rgba(45, 122, 45, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(45, 122, 45, 0.2);
            border-color: rgba(45, 122, 45, 0.4);
            transform: scale(1.08);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--color-primary);
            stroke-width: 2;
            fill: none;
        }

        @media (max-width: 768px) {
            .back-btn {
                top: 70px;
                right: 16px;
                width: 38px;
                height: 38px;
            }

            .back-btn svg {
                width: 16px;
                height: 16px;
            }
        }
            .game-wheel .game-item .icon svg { width: 1em; height: 1em; }
    </style>

    <script>
        (() => {
            /* ========================================
               UTILITIES
            ======================================== */
            function debounce(fn, wait) {
                let t;
                return function (...args) {
                    clearTimeout(t);
                    t = setTimeout(() => fn.apply(this, args), wait);
                };
            }

            /* ========================================
               WHEEL LOGIC
            ======================================== */
            const ACTIVE = [];

            function createWheel(section) {
                const wheel = section.querySelector('.game-wheel');
                const items = [...wheel.querySelectorAll('.game-item')];
                const n = items.length;

                const parsed = parseFloat(section.dataset.speed);
                const speedDeg = Number.isFinite(parsed) ? parsed : 0.25;
                const dirAttr = String(section.dataset.direction || 'right').toLowerCase();
                const dir = dirAttr === 'left' ? -1 : 1;

                let radius = 0;
                let angles = [];
                let cx = 0, cy = 0;
                let rafId = null;
                let lastTime = 0;

                const DEG2RAD = Math.PI / 180;

                // 初始化样式：重置 left/top 为 0，避免 CSS 中的 50% 干扰
                function initStyles() {
                    items.forEach(item => {
                        item.style.position = 'absolute';
                        item.style.left = '0';
                        item.style.top = '0';
                    });
                }

                function computeLayout() {
                    const rect = section.getBoundingClientRect();
                    cx = rect.width / 2;
                    cy = rect.height / 2;

                    const half = Math.min(rect.width, rect.height) / 2;
                    const isMobile = window.innerWidth <= 768;
                    const raw = isMobile
                        ? (section.dataset.radiusMobile || '58').toString().trim().toLowerCase()
                        : (section.dataset.radius || '68').toString().trim().toLowerCase();
                    const pct = Number(raw);
                    radius = (isFinite(pct) ? pct : (isMobile ? 58 : 68)) / 100 * half;

                    if (angles.length !== n) {
                        angles = Array.from({ length: n }, (_, i) => (360 / n) * i);
                    }
                }

                function updatePositions() {
                    for (let i = 0; i < n; i++) {
                        const rad = angles[i] * DEG2RAD;
                        const x = cx + radius * Math.cos(rad);
                        const y = cy + radius * Math.sin(rad);
                        // translate3d 开启 GPU 加速；translate(-50%,-50%) 居中自身
                        items[i].style.transform =
                            `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -50%)`;
                    }
                }

                function tick(dt) {
                    const step = dir * speedDeg * dt;
                    for (let i = 0; i < n; i++) {
                        angles[i] = (angles[i] + step) % 360;
                        if (angles[i] < 0) angles[i] += 360;
                    }
                }

                function animate(time) {
                    if (!lastTime) lastTime = time;
                    const dt = (time - lastTime) / 16.67;
                    lastTime = time;
                    tick(dt || 1);
                    updatePositions();
                    rafId = requestAnimationFrame(animate);
                }

                function bindUI() {
                    items.forEach(item => {
                        item.addEventListener('mouseenter', () => {
                            item.style.zIndex = '10';
                        });
                        item.addEventListener('mouseleave', () => {
                            item.style.zIndex = '';
                        });
                    });
                    rafId = requestAnimationFrame(animate);
                }

                function onResize() {
                    computeLayout();
                    updatePositions();
                }

                function destroy() {
                    if (rafId) cancelAnimationFrame(rafId);
                }

                return {
                    init() {
                        initStyles();
                        computeLayout();
                        updatePositions();
                        bindUI();
                    },
                    destroy,
                    onResize: debounce(onResize, 150)
                };
            }

            function initAll(root = document) {
                const sections = root.querySelectorAll('.game-wheel-section');
                for (const sec of sections) {
                    const inst = createWheel(sec);
                    inst.init();
                    ACTIVE.push(inst);
                }
            }

            window.addEventListener('resize', () => {
                ACTIVE.forEach(i => i.onResize());
            });

            initAll(document);
        })();
    </script>
