<head>

    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

        href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Space+Grotesk:wght@400;600;700&display=swap"

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--color-bg, #fdfbf7);
        }

        body {
            font-family: 'ZCOOL KuaiLe', 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .project-slider {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .project-slider__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            flex-shrink: 0;
        }


        .project-slider__body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 32px 40px;
            min-height: 0;
            position: relative;
        }

        .project-slider__left {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 4;
        }

        .project-slider__title {
            font-size: clamp(48px, 12vw, 140px);
            font-weight: 700;
            color: #333;
            line-height: 1.15;
            letter-spacing: -0.02em;
            overflow: hidden;
            position: relative;
            margin-top: 0;
            margin-bottom: auto;
        }

        .project-slider__title span {
            display: inline-block;
            will-change: transform;
        }

        .project-slider__footer {
            flex-shrink: 0;
            margin-top: 32px;
        }

        .project-slider__description {
            font-size: 14px;
            letter-spacing: 0.5px;
            color: rgba(51, 51, 51, 0.9);
            line-height: 1.8;
        }

        .project-slider__tech {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding-bottom: 10px;
        }

        .project-slider__tech span {
            font-size: 12px;
            padding: 3px 6px;
            border-radius: 20px;
            background: rgba(45, 122, 45, 0.15);
            color: #2d7a2d;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .project-slider__right {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .project-slider__images {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .project-slider__slide {
            position: absolute;
            top: 40%;
            left: 50%;
            width: 55%;
            aspect-ratio: 1.4;
            overflow: hidden;
            will-change: transform, filter, opacity;
            contain: layout style;
        }

        .project-slider__slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }




        @media screen and (max-width: 768px) {
            .project-slider__header {
                padding: 40px 32px;
            }

            .project-slider__body {
                padding: 0 24px 56px;
            }

            .project-slider__footer {
                margin-top: 48px;
            }

            .project-slider__slide {
                width: 60%;
            }

            .project-slider__cursor {
                width: 88px;
                height: 88px;
            }

            .project-slider__description {
                font-size: 13px;
            }

            .project-slider__tech span {
                font-size: 11px;
            }
        }

        @media screen and (min-width: 1024px) {
            .project-slider__body {
                flex-direction: row;
            }

            .project-slider__left {
                width: 55%;
                flex-shrink: 0;
                z-index: auto;
            }

            .project-slider__title {
                margin-top: auto;
                margin-bottom: auto;
            }

            .project-slider__right {
                position: static;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 0;
                opacity: 1;
                pointer-events: auto;
            }

            .project-slider__slide {
                width: 68%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .project-slider__slide,
            .project-slider__title span {
                will-change: auto;
            }
        }

        .back-btn {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 101;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(45, 122, 45, 0.1);
            border: 1px solid rgba(45, 122, 45, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(45, 122, 45, 0.2);
            border-color: rgba(45, 122, 45, 0.4);
            transform: scale(1.08);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: #2d7a2d;
            stroke-width: 2;
            fill: none;
        }

        @media (max-width: 768px) {
            .back-btn {
                top: 70px;
                right: 16px;
                width: 38px;
                height: 38px;
            }

            .back-btn svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>

</head>

<body>
    <a href="../works.html" class="back-btn" aria-label="返回" target="_self" onclick="history.back(); return false;">
        <svg viewBox="0 0 24 24">
            <path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

    <div id="header-container"></div>

    <section class="project-slider">
        <div class="project-slider__header">
        </div>

        <div class="project-slider__body">
            <div class="project-slider__left">
                <h2 class="project-slider__title" aria-live="polite"></h2>
                <div class="project-slider__footer">
                    <p class="project-slider__description"></p>
                    <div class="project-slider__tech"></div>
                </div>
            </div>
            <div class="project-slider__right">
                <div class="project-slider__images"></div>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script type="module" src="../js/components.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        /* ========================================
           UTILITIES
        ======================================== */
        const throttle = (callback, limit) => {
            let waiting = false;
            return function () {
                if (!waiting) {
                    callback.apply(this, arguments);
                    waiting = true;
                    setTimeout(() => {
                        waiting = false;
                    }, limit);
                }
            };
        };

        const debounce = (func, wait, immediate) => {
            let timeout;
            return function () {
                const context = this;
                const args = arguments;
                const later = function () {
                    timeout = null;
                    if (!immediate) func.apply(context, args);
                };
                const callNow = immediate && !timeout;
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
                if (callNow) func.apply(context, args);
            };
        };

        /* ========================================
           CONFIG
        ======================================== */
        const PROJECTS = [
            {
                name: "信购AI",
                image: "../images/projects/信购 AI .webp",
                description: "2026.03 - 2026.06 | 中国大学生计算机设计大赛<br>设计微服务架构，FastAPI独立部署ML服务实现前后端解耦<br>Chinese-CLIP图文相似度 + SVM虚假评论识别 + 豆包大模型<br>开发ECharts可视化大屏，实时展示商品可信度评分<br>设计色差检测算法，解决服装退货率70-90%行业痛点",
                tech: ["Vue3", "Element Plus", "Spring Boot", "FastAPI", "Chinese-CLIP", "豆包大模型", "MySQL"]
            },
            {
                name: "MES系统",
                image: "../images/projects/双碳管理系统.webp",
                description: "2025.12 - 2026.04 | 广东省职业院校技能大赛省二等奖<br>独立完成产品原型设计（Axure）→ 前后端开发 → 部署测试全链路<br>搭建三端部署架构（管理端/用户端/可视化大屏），Nginx反向代理<br>开发实时数据可视化大屏，集成能耗仪表盘、动态图表<br>使用JMeter完成接口压力测试，保障系统稳定性",
                tech: ["Vue.js", "Element UI", "Spring Boot", "MySQL", "Nginx", "JMeter"]
            },
            {
                name: "岐青乡望",
                image: "../images/projects/岐青乡望.jpg",
                description: "独立开发 | 志愿服务小程序<br>独立完成前端页面开发与云函数编写，实现义教报名、志愿者签到、服务时长统计<br>服务家乡教育公益，累计覆盖岐石村及周边地区",
                tech: ["uni-app", "Vue.js", "uniCloud"]
            }
        ];

        const AUTOPLAY_DELAY = 5000;

        /* ========================================
           PROJECT SLIDER CLASS
        ======================================== */
        class ProjectSlider {
            constructor() {
                this.current = 0;
                this.animating = false;
                this.total = PROJECTS.length;
                this.el = document.querySelector(".project-slider");
                this.titleEl = document.querySelector(".project-slider__title");
                this.descEl = document.querySelector(".project-slider__description");
                this.techEl = document.querySelector(".project-slider__tech");
                this.imagesEl = document.querySelector(".project-slider__images");
                this.slideEls = [];
                this.currentLine = null;
                
                this.autoPlayId = null;
                this.reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

                this.preload();
                this.setContent(PROJECTS[0]);
                this.buildCarousel();
                this.buildCursor();
                this.bind();
                this.startAutoPlay();
            }

            mod(n) {
                return ((n % this.total) + this.total) % this.total;
            }

            preload() {
                PROJECTS.forEach((p) => {
                    new Image().src = p.image;
                });
            }

            startAutoPlay() {
                this.stopAutoPlay();
                this.autoPlayId = setInterval(() => {
                    if (!this.animating) this.go("next");
                }, AUTOPLAY_DELAY);
            }

            stopAutoPlay() {
                if (this.autoPlayId) {
                    clearInterval(this.autoPlayId);
                    this.autoPlayId = null;
                }
            }

            buildCursor() {
                // 已移除自定义光标，使用系统默认光标
            }

            setContent(project) {
                // 标题
                this.titleEl.innerHTML = "";
                const line = document.createElement("div");
                [...project.name].forEach((ch) => {
                    const span = document.createElement("span");
                    span.textContent = ch === " " ? "\u00A0" : ch;
                    line.appendChild(span);
                });
                this.titleEl.appendChild(line);
                this.currentLine = line;

                // 描述
                this.descEl.innerHTML = project.description;

                // 技术栈
                this.techEl.innerHTML = "";
                project.tech.forEach(t => {
                    const span = document.createElement("span");
                    span.textContent = t;
                    this.techEl.appendChild(span);
                });
            }

            animateContent(newProject, direction) {
                const h = this.titleEl.offsetHeight;
                const dir = direction === "next" ? 1 : -1;
                const oldLine = this.currentLine;
                const oldChars = [...oldLine.querySelectorAll("span")];

                this.titleEl.style.height = h + "px";
                oldLine.style.cssText = "position:absolute;top:0;left:0;width:100%";

                const newLine = document.createElement("div");
                newLine.style.cssText = "position:absolute;top:0;left:0;width:100%";
                [...newProject.name].forEach((ch) => {
                    const span = document.createElement("span");
                    span.textContent = ch === " " ? "\u00A0" : ch;
                    newLine.appendChild(span);
                });
                this.titleEl.appendChild(newLine);

                const newChars = [...newLine.querySelectorAll("span")];
                gsap.set(newChars, { y: h * dir });

                const duration = this.reducedMotion ? 0.01 : 1;
                const stagger = this.reducedMotion ? 0 : 0.04;

                const tl = gsap.timeline({
                    onComplete: () => {
                        oldLine.remove();
                        newLine.style.cssText = "";
                        gsap.set(newChars, { clearProps: "all" });
                        this.titleEl.style.height = "";
                        this.currentLine = newLine;
                    }
                });

                tl.to(oldChars, { y: -h * dir, stagger, duration, ease: "expo.inOut" }, 0);
                tl.to(newChars, { y: 0, stagger, duration, ease: "expo.inOut" }, 0);

                // 描述和技术栈动画
                gsap.to(this.descEl, {
                    opacity: 0, duration: 0.3, onComplete: () => {
                        this.descEl.innerHTML = newProject.description;
                        gsap.to(this.descEl, { opacity: 1, duration: 0.3 });
                    }
                });

                gsap.to(this.techEl, {
                    opacity: 0, duration: 0.3, onComplete: () => {
                        this.techEl.innerHTML = "";
                        newProject.tech.forEach(t => {
                            const span = document.createElement("span");
                            span.textContent = t;
                            this.techEl.appendChild(span);
                        });
                        gsap.to(this.techEl, { opacity: 1, duration: 0.3 });
                    }
                });

                return tl;
            }

            makeSlide(idx) {
                const div = document.createElement("div");
                div.className = "project-slider__slide";
                const img = document.createElement("img");
                img.src = PROJECTS[idx].image;
                img.alt = PROJECTS[idx].name;
                div.appendChild(img);
                return div;
            }

            getSlideProps(step) {
                const h = this.imagesEl.offsetHeight;
                const positions = [
                    { x: -0.35, y: -0.95, rot: -30, s: 1.35, b: 16, o: 0 },
                    { x: -0.18, y: -0.5, rot: -15, s: 1.15, b: 8, o: 0.55 },
                    { x: 0, y: 0, rot: 0, s: 1, b: 0, o: 1 },
                    { x: -0.06, y: 0.5, rot: 15, s: 0.75, b: 6, o: 0.55 },
                    { x: -0.12, y: 0.95, rot: 30, s: 0.55, b: 14, o: 0 }
                ];
                const idx = Math.max(0, Math.min(4, step + 2));
                const p = positions[idx];
                return {
                    x: p.x * h,
                    y: p.y * h,
                    rotation: p.rot,
                    scale: p.s,
                    blur: p.b,
                    opacity: p.o,
                    zIndex: Math.abs(step) === 0 ? 3 : Math.abs(step) === 1 ? 2 : 1
                };
            }

            positionSlide(slide, step) {
                const props = this.getSlideProps(step);
                gsap.set(slide, {
                    xPercent: -50,
                    yPercent: -50,
                    x: props.x,
                    y: props.y,
                    rotation: props.rotation,
                    scale: props.scale,
                    opacity: props.opacity,
                    filter: "blur(" + props.blur + "px)",
                    zIndex: props.zIndex
                });
            }

            buildCarousel() {
                if (!this.imagesEl || this.imagesEl.offsetHeight === 0) return;
                this.imagesEl.innerHTML = "";
                this.slideEls = [];

                for (let step = -1; step <= 1; step++) {
                    const idx = this.mod(this.current + step);
                    const slide = this.makeSlide(idx);
                    this.imagesEl.appendChild(slide);
                    this.positionSlide(slide, step);
                    this.slideEls.push({ el: slide, step: step });
                }
            }

            animateCarousel(direction) {
                if (!this.imagesEl || this.imagesEl.offsetHeight === 0) return gsap.timeline();

                const shift = direction === "next" ? -1 : 1;
                const enterStep = direction === "next" ? 2 : -2;
                const newIdx = direction === "next" ? this.mod(this.current + 2) : this.mod(this.current - 2);

                const newSlide = this.makeSlide(newIdx);
                this.imagesEl.appendChild(newSlide);
                this.positionSlide(newSlide, enterStep);
                this.slideEls.push({ el: newSlide, step: enterStep });

                this.slideEls.forEach(s => {
                    s.step += shift;
                });

                const duration = this.reducedMotion ? 0.01 : 1.2;

                const tl = gsap.timeline({
                    onComplete: () => {
                        this.slideEls = this.slideEls.filter(s => {
                            if (Math.abs(s.step) >= 2) {
                                s.el.remove();
                                return false;
                            }
                            return true;
                        });
                    }
                });

                this.slideEls.forEach(s => {
                    const props = this.getSlideProps(s.step);
                    s.el.style.zIndex = props.zIndex;
                    tl.to(s.el, {
                        x: props.x,
                        y: props.y,
                        rotation: props.rotation,
                        scale: props.scale,
                        opacity: props.opacity,
                        filter: "blur(" + props.blur + "px)",
                        duration: duration,
                        ease: "power3.inOut"
                    }, 0);
                });

                return tl;
            }

            go(direction) {
                if (this.animating) return;
                this.animating = true;
                this.startAutoPlay();

                const nextIdx = direction === "next" ? this.mod(this.current + 1) : this.mod(this.current - 1);

                const master = gsap.timeline({
                    onComplete: () => {
                        this.current = nextIdx;
                        this.animating = false;
                    }
                });

                master.add(this.animateContent(PROJECTS[nextIdx], direction), 0);
                master.add(this.animateCarousel(direction), 0);
            }

            bind() {
                // Wheel - 带节流
                const onWheel = throttle((e) => {
                    if (this.animating) return;
                    this.go(e.deltaY > 0 ? "next" : "prev");
                }, 1800);
                window.addEventListener("wheel", onWheel, { passive: true });

                // Touch
                let touchStartY = 0;
                window.addEventListener("touchstart", (e) => {
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                const onTouchEnd = throttle((e) => {
                    if (this.animating) return;
                    const diff = touchStartY - e.changedTouches[0].clientY;
                    if (Math.abs(diff) < 40) return;
                    this.go(diff > 0 ? "next" : "prev");
                }, 1800);
                window.addEventListener("touchend", onTouchEnd, { passive: true });

                // Keyboard
                window.addEventListener("keydown", (e) => {
                    if (this.animating) return;
                    if (e.key === "ArrowDown" || e.key === "ArrowRight") this.go("next");
                    if (e.key === "ArrowUp" || e.key === "ArrowLeft") this.go("prev");
                });

                // Cursor - 使用系统默认光标

                // Resize - 带防抖
                const onResize = debounce(() => {
                    if (!this.animating && this.imagesEl.offsetHeight > 0) {
                        this.slideEls.forEach(s => {
                            this.positionSlide(s.el, s.step);
                        });
                    }
                }, 300);
                window.addEventListener("resize", onResize, { passive: true });

                // Visibility - 页面隐藏时暂停自动播放
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "hidden") {
                        this.animating = false;
                        this.stopAutoPlay();
                    } else {
                        this.startAutoPlay();
                    }
                });
            }
        }

        /* ========================================
           INIT
        ======================================== */
        window.addEventListener('load', function () {
            new ProjectSlider();
        });
    </script>
</body>
