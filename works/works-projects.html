    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            /* 禁用下拉刷新/橡皮筋/边缘返回，避免垂直滑动手势被浏览器原生行为抢走 */
            overscroll-behavior: none;
            overscroll-behavior-y: none;
            background: var(--color-bg, #fdfbf7);
        }

        body {
            font-family: 'ZCOOL KuaiLe', 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .project-slider {
            /* 桌面排版基准：所有几何值都由这几个变量推导，五个项目共用同一套尺寸 */
            --sl-gutter: 32px;
            --sl-pad-top: 88px;
            --sl-pad-bottom: 40px;
            --sl-left-w: 52%;
            --sl-title-gap: 28px;
            --sl-desc-w: 620px;
            /* 描述最后一行与技术栈标签之间的固定间距（整块内部节奏） */
            --sl-block-gap: 18px;
            /* 卡片宽度 = 右栏可用的 92%；高度按 2.07 反算，教务百事通的卡片高度保持不变 */
            --sl-card-h: calc((100vw - var(--sl-gutter) * 2) * 0.48 * 0.92 / 2.07);
            --sl-content-h: calc(100dvh - var(--sl-pad-top) - var(--sl-pad-bottom));

            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            /* 垂直手势交给 JS 切换项目，阻止浏览器把它当成页面滚动/下拉刷新 */
            touch-action: none;
            display: flex;
            flex-direction: column;
        }

        .project-slider__body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 32px 40px;
            min-height: 0;
            position: relative;
        }

        .project-slider__left {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 4;
        }

        .project-slider__title {
            font-size: clamp(48px, 12vw, 140px);
            font-weight: 700;
            color: #333;
            line-height: 1.15;
            letter-spacing: -0.02em;
            overflow: hidden;
            position: relative;
            margin-top: 0;
            margin-bottom: auto;
        }

        .project-slider__title span {
            display: inline-block;
            will-change: transform;
        }

        .project-slider__footer {
            flex-shrink: 0;
            margin-top: 32px;
        }

        .project-slider__description {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: rgba(51, 51, 51, 0.9);
            line-height: 1.85;
            /* 不加底色/边框：保持干净的裸文本，只靠行长与行距拉开呼吸感 */
            max-width: 620px;
            padding-left: 2px;
        }

        .project-slider__description strong {
            font-weight: 700;
        }

        .project-slider__description .award-green {
            color: #92d050;
            font-weight: 600;
        }

        .project-slider__tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .project-slider__tech span {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 12px;
            padding: 4px 11px;
            border-radius: 20px;
            background: rgba(45, 122, 45, 0.15);
            color: #2d7a2d;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .project-slider__right {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .project-slider__images {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .project-slider__slide {
            position: absolute;
            top: 40%;
            left: 50%;
            width: 58%;
            aspect-ratio: 2.07;
            overflow: hidden;
            pointer-events: auto; /* 父容器在移动端是 none，卡片需自己恢复点击/手势 */
            will-change: transform;
            contain: layout style;
        }

        .project-slider__slide img {
            width: 100%;
            height: 100%;
            /* contain 而非 cover：截图整张完整呈现，与放大视图完全一致，不裁切边缘 */
            object-fit: contain;
            background: #fff;
        }

        /* 项目内图片轮播（多图时启用） */
        .project-slider__slide img {
            position: absolute;
            inset: 0;
            transition: opacity .55s ease;
        }

        .project-slider__slide img.is-hidden {
            opacity: 0;
        }

        .project-slider__dots {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 7px;
            z-index: 4;
            opacity: 0;
            transition: opacity .35s;
            pointer-events: none;
        }

        .project-slider__slide.is-front .project-slider__dots {
            opacity: 1;
            pointer-events: auto;
        }

        .project-slider__dot {
            width: 7px;
            height: 7px;
            border-radius: 4px;
            border: none;
            padding: 0;
            background: rgba(255, 255, 255, .55);
            cursor: pointer;
            transition: background .3s, width .3s;
        }

        .project-slider__dot.is-active {
            background: #fff;
            width: 18px;
        }

        /* 手动切换箭头（悬停正面卡片时出现） */
        .project-slider__img-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            padding: 0;
            background: rgba(0, 0, 0, .28);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s, background .3s;
        }

        .project-slider__img-nav svg {
            width: 16px;
            height: 16px;
        }

        .project-slider__img-nav.prev { left: 10px; }
        .project-slider__img-nav.next { right: 10px; }

        .project-slider__slide.is-front:hover .project-slider__img-nav {
            opacity: 1;
            pointer-events: auto;
        }

        .project-slider__img-nav:hover {
            background: rgba(0, 0, 0, .45);
        }

        /* 正面卡片可点击放大 */
        .project-slider__slide.is-front {
            cursor: zoom-in;
        }

        /* ============ 点击放大 Lightbox ============ */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(17, 20, 14, .92);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity .35s ease, visibility .35s;
        }

        .lightbox.is-open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox__img {
            max-width: min(1400px, 92vw);
            max-height: 86vh;
            border-radius: 10px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .5);
            transform: scale(.94);
            transition: transform .35s cubic-bezier(.22, .8, .3, 1);
            user-select: none;
            -webkit-user-drag: none;
        }

        .lightbox.is-open .lightbox__img {
            transform: scale(1);
        }

        .lightbox__btn {
            position: absolute;
            width: clamp(38px, 9vw, 48px);
            height: clamp(38px, 9vw, 48px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .3);
            padding: 0;
            background: rgba(28, 32, 24, .5);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
            transition: background .25s, transform .25s, border-color .25s, box-shadow .25s;
            z-index: 2;
        }

        /* 隐形扩大点击热区，手机上更好按 */
        .lightbox__btn::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
        }

        .lightbox__btn:hover {
            background: rgba(255, 255, 255, .24);
            border-color: rgba(255, 255, 255, .6);
            box-shadow: 0 8px 26px rgba(0, 0, 0, .38);
        }

        .lightbox__btn svg {
            width: clamp(16px, 3.8vw, 20px);
            height: clamp(16px, 3.8vw, 20px);
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3));
        }

        .lightbox__close { top: 28px; right: 32px; }
        .lightbox__close:hover { transform: scale(1.08); }

        .lightbox__counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, .75);
            font-size: 13px;
            letter-spacing: 2px;
        }

        @media screen and (max-width: 768px) {
            .lightbox__btn { width: 32px; height: 32px; }
            .lightbox__btn svg { width: 14px; height: 14px; }
            .lightbox__close { top: 16px; right: 16px; }
        }

        @media screen and (max-width: 768px) {
            /* 手机上导航/footer 是 fixed 悬浮层：底部由 body 的 padding 预留 footer 高度 */
            .project-slider__body {
                padding: 56px 20px 66px;
            }

            /* 手机版重排：标题 → 大图 → 描述，图片回到文档流不再漂在覆盖层上 */
            .project-slider__left {
                display: contents;
            }

            .project-slider__title {
                order: 1;
                font-size: clamp(40px, 13vw, 64px);
                margin: 4px 0 8px;
            }

            .project-slider__right {
                order: 2;
                position: static;
                width: auto;
                height: auto;
                /* 三个项目的三个分区高度严格一致（取最高内容 MES 为基准）：
                   图片区 = 100vh - 480px，任何项目都不收缩、不裁切 */
                flex: 0 0 auto;
                height: calc(100vh - 480px);
                min-height: 120px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .project-slider__footer {
                order: 3;
                margin-top: 12px;
                flex-shrink: 0;
            }

            .project-slider__slide {
                top: 50%;
                /* 卡片高度（宽/2.07）不得超过图片区高度，矮屏时按区高反算宽度 */
                width: min(86%, calc((100vh - 480px) * 1.95));
            }

            .project-slider__cursor {
                width: 88px;
                height: 88px;
            }

            /* 手机端维持原有观感，桌面端的新排版不渗透到窄屏 */
            .project-slider__description {
                font-size: 13px;
                line-height: 1.8;
                max-width: none;
                padding-left: 0;
            }

            .project-slider__tech {
                padding-bottom: 0;
                gap: 2px;
                margin-top: 0;
            }

            .project-slider__tech span {
                font-size: 11px;
                padding: 3px 6px;
            }
        }

        /* ≤1023px：图片区为绝对定位覆盖层，文字层会挡住卡片点击，放行 */
        @media screen and (max-width: 1023px) {
            .project-slider__left {
                pointer-events: none;
            }
        }

        @media screen and (min-width: 1024px) {
            .project-slider__body {
                flex-direction: row;
                /* 桌面顶部预留固定导航净空，防止标题被裁切 */
                padding: var(--sl-pad-top) var(--sl-gutter) var(--sl-pad-bottom);
            }

            .project-slider__left {
                width: var(--sl-left-w);
                flex: 0 0 var(--sl-left-w);
                z-index: auto;
                /* 固定起点：不再随文案长短上下居中。标题顶边对齐图片卡顶边 */
                justify-content: flex-start;
                padding-top: max(0px, calc((var(--sl-content-h) - var(--sl-card-h)) / 2));
            }

            .project-slider__title {
                /* 固定单行标题槽：任何项目名都只占一行，高度不随字数变化 */
                margin: 0 0 var(--sl-title-gap);
                font-size: clamp(40px, min(5vw, 14vh), 104px);
                line-height: 1.12;
                height: 1.12em;
                white-space: nowrap;
            }

            .project-slider__right {
                position: static;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 0;
                opacity: 1;
                pointer-events: auto;
            }

            /* 桌面：卡片放大并在图片区内垂直居中，消除右上悬空、中部留白 */
            .project-slider__slide {
                top: 50%;
                width: 92%;
            }

            .project-slider__footer {
                margin-top: 0;
                /* 日期 + 描述 + 标签是一个整体块：内部按固定间距紧凑排列，不再被撑开 */
                display: flex;
                flex-direction: column;
                gap: var(--sl-block-gap);
            }

            .project-slider__description {
                width: min(100%, var(--sl-desc-w));
                max-width: var(--sl-desc-w);
                /* 不设固定槽：描述有多少行就占多少，标签紧跟末行，整块保持紧凑 */
                min-height: 0;
            }

            .project-slider__tech {
                margin-top: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .project-slider__slide,
            .project-slider__title span {
                will-change: auto;
            }
        }

    </style>

    <script>
        /* ========================================
           UTILITIES
        ======================================== */
        const throttle = (callback, limit) => {
            let waiting = false;
            return function () {
                if (!waiting) {
                    callback.apply(this, arguments);
                    waiting = true;
                    setTimeout(() => {
                        waiting = false;
                    }, limit);
                }
            };
        };

        const debounce = (func, wait, immediate) => {
            let timeout;
            return function () {
                const context = this;
                const args = arguments;
                const later = function () {
                    timeout = null;
                    if (!immediate) func.apply(context, args);
                };
                const callNow = immediate && !timeout;
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
                if (callNow) func.apply(context, args);
            };
        };

        /* ========================================
           CONFIG
        ======================================== */
        const PROJECTS = [
            {
                // 第 1 个项目：教务百事通（2026.10 - 至今）
                name: "教务百事通",
                image: "../images/projects/jiaowu-2.jpg",

        const AUTOPLAY_DELAY = 5000;
        const IMAGE_INTERVAL = 2600; // 项目内图片轮播间隔

        /* ========================================
           PROJECT SLIDER CLASS
        ======================================== */
        class ProjectSlider {
            constructor() {
                this.current = 0;
                this.animating = false;
                this.total = PROJECTS.length;
                this.el = document.querySelector(".project-slider");
                this.titleEl = document.querySelector(".project-slider__title");
                this.descEl = document.querySelector(".project-slider__description");
                this.techEl = document.querySelector(".project-slider__tech");
                /* 描述 + 标签是一个整体块：切换时一起动、一起换，高度平滑过渡 */
                this.footerEl = document.querySelector(".project-slider__footer");
                this.imagesEl = document.querySelector(".project-slider__images");
                this.slideEls = [];
                this.currentLine = null;
                
                this.autoPlayId = null;
                this.reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

                this.preload();
                this.setContent(PROJECTS[0]);
                this.buildCarousel();
                this.buildCursor();
                this.buildLightbox();
                this.bind();
                this.startAutoPlay();
                this.startImageLoop();
            }

            mod(n) {
                return ((n % this.total) + this.total) % this.total;
            }

            preload(idx) {
                // 滑动窗口：预载 n-1 / n / n+1 三个项目的首图，其余按浏览进度按需加载。
                // 轮播是环形（左右切换用 mod 回绕），窗口越界同样回绕
                const start = idx === undefined ? this.current : idx;
                [start - 1, start, start + 1].forEach((i) => {
                    const p = PROJECTS[this.mod(i)];
                    if (!p) return;
                    const first = this.imgsOf(p)[0];
                    if (first) new Image().src = first;
                });
            }

            imgsOf(p) {
                return (p.images && p.images.length) ? p.images : [p.image];
            }

            startAutoPlay(idx) {
                this.stopAutoPlay();
                // 多图项目：等项目内图片轮完一轮再切下一个项目
                const p = PROJECTS[idx !== undefined ? idx : this.current];
                const delay = this.imgsOf(p).length > 1
                    ? this.imgsOf(p).length * IMAGE_INTERVAL + 1200
                    : AUTOPLAY_DELAY;
                this.autoPlayId = setInterval(() => {
                    if (!this.animating) this.go("next");
                }, delay);
            }

            stopAutoPlay() {
                if (this.autoPlayId) {
                    clearInterval(this.autoPlayId);
                    this.autoPlayId = null;
                }
            }

            buildCursor() {
                // 已移除自定义光标，使用系统默认光标
            }

            setContent(project) {
                // 标题
                this.titleEl.innerHTML = "";
                const line = document.createElement("div");
                [...project.name].forEach((ch) => {
                    const span = document.createElement("span");
                    span.textContent = ch === " " ? "\u00A0" : ch;
                    line.appendChild(span);
                });
                this.titleEl.appendChild(line);
                this.currentLine = line;

                // 描述
                this.descEl.innerHTML = project.description;

                // 技术栈
                this.techEl.innerHTML = "";
                project.tech.forEach(t => {
                    const span = document.createElement("span");
                    span.textContent = t;
                    this.techEl.appendChild(span);
                });
            }

            animateContent(newProject, direction) {
                const h = this.titleEl.offsetHeight;
                const dir = direction === "next" ? 1 : -1;
                const oldLine = this.currentLine;
                const oldChars = [...oldLine.querySelectorAll("span")];

                this.titleEl.style.height = h + "px";
                oldLine.style.cssText = "position:absolute;top:0;left:0;width:100%";

                const newLine = document.createElement("div");
                newLine.style.cssText = "position:absolute;top:0;left:0;width:100%";
                [...newProject.name].forEach((ch) => {
                    const span = document.createElement("span");
                    span.textContent = ch === " " ? "\u00A0" : ch;
                    newLine.appendChild(span);
                });
                this.titleEl.appendChild(newLine);

                const newChars = [...newLine.querySelectorAll("span")];
                gsap.set(newChars, { y: h * dir });

                const duration = this.reducedMotion ? 0.01 : 1;
                const stagger = this.reducedMotion ? 0 : 0.04;

                const tl = gsap.timeline({
                    onComplete: () => {
                        oldLine.remove();
                        newLine.style.cssText = "";
                        gsap.set(newChars, { clearProps: "all" });
                        this.titleEl.style.height = "";
                        this.currentLine = newLine;
                    }
                });

                tl.to(oldChars, { y: -h * dir, stagger, duration, ease: "expo.inOut" }, 0);
                tl.to(newChars, { y: 0, stagger, duration, ease: "expo.inOut" }, 0);

                // 描述 + 技术栈：作为同一个整体块切换。
                // 描述不设固定槽，标签跟在末行后面；所以要让标签「滑动」而不是「瞬跳」，
                // 必须补间描述块自身的可用高度 —— 补间 footer 高度只会裁掉底部，标签仍会跳。
                const footer = this.footerEl;
                const oldDescH = this.descEl.offsetHeight;

                gsap.to(footer, {
                    opacity: 0,
                    duration: this.reducedMotion ? 0.01 : 0.22,
                    ease: "power1.out",
                    onComplete: () => {
                        this.descEl.innerHTML = newProject.description;

                        this.techEl.innerHTML = "";
                        newProject.tech.forEach(t => {
                            const span = document.createElement("span");
                            span.textContent = t;
                            this.techEl.appendChild(span);
                        });

                        if (this.reducedMotion) {
                            gsap.set(footer, { opacity: 1 });
                            return;
                        }

                        const newDescH = this.descEl.scrollHeight;
                        if (newDescH !== oldDescH) {
                            this.descEl.style.overflow = "hidden";
                            gsap.fromTo(this.descEl,
                                { height: oldDescH },
                                {
                                    height: newDescH,
                                    duration: 0.42,
                                    ease: "power2.out",
                                    onComplete: () => {
                                        this.descEl.style.height = "";
                                        this.descEl.style.overflow = "";
                                    }
                                });
                        }

                        gsap.to(footer, { opacity: 1, duration: 0.32, ease: "power1.out" });
                    }
                });

                return tl;
            }

            /* ---- 点击放大 Lightbox ---- */
            buildLightbox() {
                const lb = document.createElement("div");
                lb.className = "lightbox";
                lb.innerHTML =
                    '<img class="lightbox__img" alt="项目截图预览">' +
                    '<button type="button" class="lightbox__btn lightbox__close" aria-label="关闭">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>' +
                    '<button type="button" class="lb-arrow lb-arrow--prev" aria-label="上一张"></button>' +
                    '<button type="button" class="lb-arrow lb-arrow--next" aria-label="下一张"></button>' +
                    '<div class="lightbox__counter"></div>';
                document.body.appendChild(lb);
                this.lightboxEl = lb;
                this.lbImg = lb.querySelector(".lightbox__img");
                this.lbCounter = lb.querySelector(".lightbox__counter");
                this.lbList = [];
                this.lbIdx = 0;
                this.lbSlide = null;

                lb.querySelector(".lightbox__close").addEventListener("click", (e) => {
                    e.stopPropagation();
                    this.closeLightbox();
                });
                const nav = (dir) => {
                    lb.querySelector(".lb-arrow--" + dir).addEventListener("click", (e) => {
                        e.stopPropagation();
                        this.lbStep(dir);
                    });
                };
                nav("prev");
                nav("next");
                // 点击背景关闭（图片本身不关闭）
                lb.addEventListener("click", () => this.closeLightbox());
                this.lbImg.addEventListener("click", (e) => e.stopPropagation());
                // 手机横滑切换大图
                let lbTx = 0;
                lb.addEventListener("touchstart", (e) => {
                    lbTx = e.touches[0].clientX;
                }, { passive: true });
                lb.addEventListener("touchend", (e) => {
                    const dx = e.changedTouches[0].clientX - lbTx;
                    if (Math.abs(dx) < 40) return;
                    this.lbStep(dx < 0 ? "next" : "prev");
                });
            }

            isLightboxOpen() {
                return !!(this.lightboxEl && this.lightboxEl.classList.contains("is-open"));
            }

            lbStep(dir) {
                const n = this.lbList.length;
                if (n < 2) return;
                this.lbIdx = (this.lbIdx + (dir === "next" ? 1 : n - 1)) % n;
                this.updateLightbox();
            }

            updateLightbox() {
                this.lbImg.src = this.lbList[this.lbIdx];
                this.lbCounter.textContent = (this.lbIdx + 1) + " / " + this.lbList.length;
                const multi = this.lbList.length > 1;
                this.lightboxEl.querySelectorAll(".lb-arrow").forEach(b => {
                    b.style.display = multi ? "block" : "none";
                });
                this.lbCounter.style.display = multi ? "block" : "none";
            }

            openLightbox(list, idx, slideEl) {
                this.lbList = list;
                this.lbIdx = idx;
                this.lbSlide = slideEl;
                // 打开放大图时一次性预热该项目全部图片，左右切换不再临时请求、无延迟
                (list || []).forEach(src => {
                    if (src) new Image().src = src;
                });
                this.updateLightbox();
                this.lightboxEl.classList.add("is-open");
                // 打开期间暂停两套自动轮播
                this.stopImageLoop();
                this.stopAutoPlay();
            }

            closeLightbox() {
                this.lightboxEl.classList.remove("is-open");
                // 卡片同步到刚才查看的那张
                if (this.lbSlide) this.showImage(this.lbSlide, this.lbIdx);
                this.startAutoPlay();
                this.startImageLoop();
            }

            makeSlide(idx) {
                const p = PROJECTS[idx];
                const div = document.createElement("div");
                div.className = "project-slider__slide";
                const imgs = this.imgsOf(p);
                imgs.forEach((src, i) => {
                    const img = document.createElement("img");
                    // 首图立即加载，其余延后到真正展示时再取（避免一次性拉全量截图）
                    if (i === 0) img.src = src;
                    else img.dataset.src = src;
                    img.alt = p.name;
                    img.decoding = "async";
                    if (i > 0) img.classList.add("is-hidden");
                    div.appendChild(img);
                });
                if (imgs.length > 1) {
                    const dots = document.createElement("div");
                    dots.className = "project-slider__dots";
                    imgs.forEach((_, i) => {
                        const d = document.createElement("button");
                        d.type = "button";
                        d.className = "project-slider__dot" + (i === 0 ? " is-active" : "");
                        d.setAttribute("aria-label", "第" + (i + 1) + "张图");
                        d.addEventListener("click", (e) => {
                            e.stopPropagation();
                            this.showImage(div, i);
                            this.startImageLoop(); // 从当前图重新计时
                        });
                        dots.appendChild(d);
                    });
                    div.appendChild(dots);
                    // 左右箭头（悬停出现）
                    const mkNav = (dir) => {
                        const b = document.createElement("button");
                        b.type = "button";
                        b.className = "project-slider__img-nav " + dir;
                        b.setAttribute("aria-label", dir === "prev" ? "上一张" : "下一张");
                        b.innerHTML = dir === "prev"
                            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'
                            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
                        b.addEventListener("click", (e) => {
                            e.stopPropagation();
                            const list = div.querySelectorAll("img");
                            const cur = div._imgIdx || 0;
                            const nxt = (cur + (dir === "next" ? 1 : list.length - 1)) % list.length;
                            this.showImage(div, nxt);
                            this.startImageLoop(); // 从当前图重新计时
                        });
                        return b;
                    };
                    div.appendChild(mkNav("prev"));
                    div.appendChild(mkNav("next"));
                }
                // 鼠标移入 / 手指按下时冻结轮播：保证「看到哪张，点开放大就是哪张」
                div.addEventListener("pointerenter", () => {
                    if (!div.classList.contains("is-front")) return;
                    this.stopImageLoop();
                });
                div.addEventListener("pointerleave", () => {
                    if (!div.classList.contains("is-front")) return;
                    this.startImageLoop();
                });
                div.addEventListener("pointerdown", () => {
                    if (!div.classList.contains("is-front")) return;
                    this.stopImageLoop();
                });

                // 点击正面卡片放大查看
                div.addEventListener("click", () => {
                    if (!div.classList.contains("is-front")) return;
                    this.stopImageLoop();
                    // 以「当前真正可见的那张」为准（而非可能刚被轮播改掉的索引）
                    let idx = div._imgIdx || 0;
                    const all = div.querySelectorAll("img");
                    const visible = [...all].findIndex(el => !el.classList.contains("is-hidden"));
                    if (visible >= 0) idx = visible;
                    this.openLightbox(imgs, idx, div);
                });
                return div;
            }

            /* ---- 项目内图片轮播 ---- */
            showImage(slide, i) {
                const imgs = slide.querySelectorAll("img");
                const dots = slide.querySelectorAll(".project-slider__dot");
                imgs.forEach((im, k) => {
                    // 懒加载：切换到哪张才真正请求哪张
                    if (k === i && im.dataset.src && !im.getAttribute("src")) im.src = im.dataset.src;
                    im.classList.toggle("is-hidden", k !== i);
                });
                dots.forEach((d, k) => d.classList.toggle("is-active", k === i));
                slide._imgIdx = i;
            }

            updateFrontClass() {
                this.slideEls.forEach(s => s.el.classList.toggle("is-front", s.step === 0));
            }

            startImageLoop() {
                this.stopImageLoop();
                const front = this.slideEls.find(s => s.step === 0);
                if (!front) return;
                const imgs = front.el.querySelectorAll("img");
                if (imgs.length < 2) return;
                this.imageTimer = setInterval(() => {
                    const i = ((front.el._imgIdx || 0) + 1) % imgs.length;
                    this.showImage(front.el, i);
                }, IMAGE_INTERVAL);
            }

            stopImageLoop() {
                if (this.imageTimer) {
                    clearInterval(this.imageTimer);
                    this.imageTimer = null;
                }
            }

            getSlideProps(step) {
                const h = this.imagesEl.offsetHeight;
                const compact = this.imagesEl.offsetWidth < 520; // 手机：隐藏装饰卡片，只保留正面卡
                const positions = [
                    { x: -0.35, y: -0.95, rot: -30, s: 1.35, b: 16, o: 0 },
                    { x: -0.18, y: -0.5, rot: -15, s: 1.15, b: 8, o: 0.55 },
                    { x: 0, y: 0, rot: 0, s: 1, b: 0, o: 1 },
                    { x: -0.06, y: 0.5, rot: 15, s: 0.75, b: 6, o: 0.55 },
                    { x: -0.12, y: 0.95, rot: 30, s: 0.55, b: 14, o: 0 }
                ];
                const idx = Math.max(0, Math.min(4, step + 2));
                const p = positions[idx];
                return {
                    x: p.x * h,
                    y: p.y * h,
                    rotation: p.rot,
                    scale: p.s,
                    blur: p.b,
                    opacity: (compact && Math.abs(step) === 1) ? 0 : p.o,
                    zIndex: Math.abs(step) === 0 ? 3 : Math.abs(step) === 1 ? 2 : 1
                };
            }

            positionSlide(slide, step) {
                const props = this.getSlideProps(step);
                gsap.set(slide, {
                    xPercent: -50,
                    yPercent: -50,
                    x: props.x,
                    y: props.y,
                    rotation: props.rotation,
                    scale: props.scale,
                    opacity: props.opacity,
                    filter: props.blur > 0 ? "blur(" + props.blur + "px)" : "none",
                    zIndex: props.zIndex
                });
            }

            buildCarousel() {
                if (!this.imagesEl || this.imagesEl.offsetHeight === 0) return;
                this.imagesEl.innerHTML = "";
                this.slideEls = [];

                for (let step = -1; step <= 1; step++) {
                    const idx = this.mod(this.current + step);
                    const slide = this.makeSlide(idx);
                    this.imagesEl.appendChild(slide);
                    this.positionSlide(slide, step);
                    this.slideEls.push({ el: slide, step: step });
                }
                this.updateFrontClass();
            }

            animateCarousel(direction) {
                if (!this.imagesEl || this.imagesEl.offsetHeight === 0) return gsap.timeline();

                const shift = direction === "next" ? -1 : 1;
                const enterStep = direction === "next" ? 2 : -2;
                const newIdx = direction === "next" ? this.mod(this.current + 2) : this.mod(this.current - 2);

                const newSlide = this.makeSlide(newIdx);
                this.imagesEl.appendChild(newSlide);
                this.positionSlide(newSlide, enterStep);
                this.slideEls.push({ el: newSlide, step: enterStep });

                this.slideEls.forEach(s => {
                    s.step += shift;
                });

                const duration = this.reducedMotion ? 0.01 : 1.2;

                const tl = gsap.timeline({
                    onComplete: () => {
                        this.slideEls = this.slideEls.filter(s => {
                            if (Math.abs(s.step) >= 2) {
                                s.el.remove();
                                return false;
                            }
                            return true;
                        });
                    }
                });

                this.slideEls.forEach(s => {
                    const props = this.getSlideProps(s.step);
                    s.el.style.zIndex = props.zIndex;
                    tl.to(s.el, {
                        x: props.x,
                        y: props.y,
                        rotation: props.rotation,
                        scale: props.scale,
                        opacity: props.opacity,
                        filter: props.blur > 0 ? "blur(" + props.blur + "px)" : "none",
                        duration: duration,
                        ease: "power3.inOut"
                    }, 0);
                });

                return tl;
            }

            go(direction) {
                if (this.animating) return;
                this.animating = true;
                // 停掉图片轮播，卡片复位到第一张图
                this.stopImageLoop();
                this.slideEls.forEach(s => {
                    this.showImage(s.el, 0);
                    s.el.classList.remove("is-front");
                });

                const nextIdx = direction === "next" ? this.mod(this.current + 1) : this.mod(this.current - 1);
                this.startAutoPlay(nextIdx);

                const master = gsap.timeline({
                    onComplete: () => {
                        this.current = nextIdx;
                        this.animating = false;
                        this.updateFrontClass();
                        this.startImageLoop();
                        this.preload(nextIdx); // 滑动窗口：备好 n-1/n/n+1 三个项目的首图
                    }
                });

                master.add(this.animateContent(PROJECTS[nextIdx], direction), 0);
                master.add(this.animateCarousel(direction), 0);
            }

            bind() {
                // Wheel —— 防连击交给 go() 里的 animating 标志，动画一结束即可再次切换
                const onWheel = (e) => {
                    if (this.animating || this.isLightboxOpen()) return;
                    this.go(e.deltaY > 0 ? "next" : "prev");
                };
                window.addEventListener("wheel", onWheel, { passive: true });

                // Touch
                let touchStartY = 0;
                let touchStartX = 0;
                let swipeHandled = false;
                window.addEventListener("touchstart", (e) => {
                    touchStartY = e.touches[0].clientY;
                    touchStartX = e.touches[0].clientX;
                    swipeHandled = false;
                }, { passive: true });

                // 垂直滑动时阻止原生滚动/下拉刷新/边缘返回手势（lightbox 打开时放行，交给它自己横滑）
                window.addEventListener("touchmove", (e) => {
                    if (this.isLightboxOpen()) return;
                    const dy = Math.abs(e.touches[0].clientY - touchStartY);
                    const dx = Math.abs(e.touches[0].clientX - touchStartX);
                    if (dy > dx) e.preventDefault();
                }, { passive: false });

                const finishSwipe = (e) => {
                    if (swipeHandled || this.animating || this.isLightboxOpen()) return;
                    const diff = touchStartY - e.changedTouches[0].clientY;
                    if (Math.abs(diff) < 40) return;
                    swipeHandled = true;
                    this.go(diff > 0 ? "next" : "prev");
                };
                // 不用固定时长的节流：go() 的 animating 在动画结束时才释放，避免"动画完了还要再等一会儿"的死区
                window.addEventListener("touchend", finishSwipe, { passive: true });
                // 手势被系统中断时也按一次滑动处理，避免下滑被系统抢走后完全无响应
                window.addEventListener("touchcancel", finishSwipe, { passive: true });

                // 项目内图片轮播 - 正面卡片上水平滑动切换
                let imgTsX = 0, imgTsY = 0;
                this.imagesEl.addEventListener("touchstart", (e) => {
                    imgTsX = e.touches[0].clientX;
                    imgTsY = e.touches[0].clientY;
                }, { passive: true });
                this.imagesEl.addEventListener("touchend", (e) => {
                    const dx = e.changedTouches[0].clientX - imgTsX;
                    const dy = e.changedTouches[0].clientY - imgTsY;
                    if (Math.abs(dx) < 40 || Math.abs(dx) <= Math.abs(dy)) return;
                    const front = this.slideEls.find(s => s.step === 0);
                    if (!front) return;
                    const list = front.el.querySelectorAll("img");
                    if (list.length < 2) return;
                    const cur = front.el._imgIdx || 0;
                    const nxt = (cur + (dx < 0 ? 1 : list.length - 1)) % list.length;
                    this.showImage(front.el, nxt);
                    this.startImageLoop();
                });

                // Keyboard
                window.addEventListener("keydown", (e) => {
                    // Lightbox 打开时接管键盘
                    if (this.isLightboxOpen()) {
                        if (e.key === "Escape") this.closeLightbox();
                        if (e.key === "ArrowRight") this.lbStep("next");
                        if (e.key === "ArrowLeft") this.lbStep("prev");
                        return;
                    }
                    if (this.animating) return;
                    if (e.key === "ArrowDown" || e.key === "ArrowRight") this.go("next");
                    if (e.key === "ArrowUp" || e.key === "ArrowLeft") this.go("prev");
                });

                // Cursor - 使用系统默认光标

                // Resize - 带防抖
                const onResize = debounce(() => {
                    if (!this.animating && this.imagesEl.offsetHeight > 0) {
                        this.slideEls.forEach(s => {
                            this.positionSlide(s.el, s.step);
                        });
                    }
                }, 300);
                window.addEventListener("resize", onResize, { passive: true });

                // Visibility - 页面隐藏时暂停自动播放
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "hidden") {
                        this.animating = false;
                        this.stopAutoPlay();
                        this.stopImageLoop();
                    } else if (!this.isLightboxOpen()) {
                        this.startAutoPlay();
                        this.startImageLoop();
                    }
                });
            }
        }

        /* ========================================
           INIT
        ======================================== */
        window.addEventListener('load', function () {
            new ProjectSlider();
        });
    </script>
    <script src="../js/lightbox-arrows.js" defer></script>
    <script src="../js/back-transition.js"></script>
</body>

</html>
