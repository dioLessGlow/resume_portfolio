<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- 底：与站内按钮同款双绿渐变，圆角 23% -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3aa757"/>
            <stop offset="1" stop-color="#276b2a"/>
        </linearGradient>
    </defs>
    <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

    <!-- 主星：凹边四角星芒，中心 (14.5,17.5) -->
    <path fill="#ffffff" d="
        M 14.5 7
        Q 16.4 15.6 25 17.5
        Q 16.4 19.4 14.5 28
        Q 12.6 19.4 4 17.5
        Q 12.6 15.6 14.5 7
        Z"/>

    <!-- 副星：右上角小星芒，中心 (25,7.5) -->
    <path fill="#ffffff" opacity="0.9" d="
        M 25 2.8
        Q 25.9 6.6 29.7 7.5
        Q 25.9 8.4 25 12.2
        Q 24.1 8.4 20.3 7.5
        Q 24.1 6.6 25 2.8
        Z"/>
</svg>
